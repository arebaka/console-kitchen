  options:
    locations:
      title: Расположения
      description: Имя, вид сервера и его адрес, например http://192.168.1.47/Nintendo/Switch/. Логин и пароль пишутся прямо в адресе, поэтому в ссылки расположения не попадают.
      fields:
        Name: Имя
        Type: Тип
        URL: Адрес

sys_clk:
