      title: Nand USER
      description: Раздел USER внутренней памяти.
    NandSYSTEM:
      title: Nand SYSTEM
      description: Раздел SYSTEM внутренней памяти.
    InstalledGames:
      title: Installed games
      description: Установленные игры, чтобы копировать их с консоли.
    SDCardInstall:
      title: SD Card install
      description: Скопированные сюда файлы устанавливаются на SD-карту.
    NANDInstall:
      title: NAND install
      description: Скопированные сюда файлы устанавливаются во внутреннюю память.
    Saves:
      title: Saves
      description: Сохранения игр.
    Album:
      title: Album
      description: Скриншоты и видео из Альбома.
    Gamecard:
      title: Gamecard
      description: Вставленный картридж.

dbi_fb2:
  title: FB2
  description: Как DBI показывает книги FB2.
  options:
    Theme:
      title: Тема
      description: Цвета страницы.
      values:
        Day: День
        Night: Ночь
        Sepia: Сепия
        Darkroom: Тёмная комната
    Hyphenation:
      title: Переносы
      description: Переносить слова между строками.
    Orientation:
      title: Ориентация
      description: Как повёрнута страница, когда открывается книга.
      values:
        '0': 0°
        '90': 90°
        '180': 180°
        '270': 270°

dbi_network_sources:
  title: Сетевые источники
