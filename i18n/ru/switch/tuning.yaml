    power_log_interval_ms:
      title: Журнал питания, мс
      description: 0 отключает его.
    csv_write_interval_ms:
      title: Журнал CSV, мс
      description: 0 отключает его.

ultrahand:
  title: Ultrahand
  description: Язык, ввод, меню, виджет, тема, уведомления и функции меню оверлеев. Тема и звуки выбираются в самом Ultrahand.
  options:
    default_lang:
      title: Язык
      description: Язык меню.
    launch_combos:
      title: Сочетания запуска
      description: Оверлеи и пакеты открываются своими сочетаниями кнопок, заданными в их настройках.
    swipe_to_open:
      title: Открытие свайпом
      description: Открывать меню свайпом от края сенсорного экрана.
    swipe_offset:
      title: Отступ свайпа, пикс.
      description: Сдвигает зону, в которой начинается свайп, на столько от края экрана. Пригодится, если экран пропускает касания у самого края. В меню Ultrahand такой настройки нет.
    haptic_feedback:
      title: Виброотклик
      description: Вибрация при перемещении по меню.
    stick_navigation:
      title: Навигация стиком
      description: Перемещаться по меню не только крестовиной, но и стиком.
    hold_duration:
      title: Время удержания, мс
      description: Сколько нужно держать кнопку в командах, которые просят удержания.
    sound_effects:
      title: Звуки
      description: Звуки меню.
    opaque_screenshots:
      title: Непрозрачные скриншоты
      description: На скриншотах, снятых с открытым меню, оно выглядит непрозрачным.
    right_alignment:
      title: Меню справа
      description: Рисовать меню у правого края экрана, а не у левого.
    auto_ntp_sync:
      title: Синхронизация NTP перед загрузками
      description: Сверять часы по сети перед загрузкой файлов, неверное время ломает защищённые соединения.
    show_packages:
      title: Меню пакетов
      description: Показывать страницу пакетов рядом со страницей оверлеев.
    page_swap:
      title: Смена страниц
      description: Открывать меню на странице пакетов, оверлеи уходят на вторую.
    show_user_guide:
      title: Руководство
      description: Показывать в меню подсказки по кнопкам.
    show_hidden:
      title: Скрытые
      description: Показывать пункт, который открывает список скрытых оверлеев и пакетов.
    show_delete:
      title: Удаление
      description: Предлагать удаление оверлея или пакета в его настройках.
    show_unsupported:
      title: Неподдерживаемые оверлеи
      description: Показывать оверлеи, не собранные под Horizon OS 21 и новее, с предупреждением. Важно только на таких системах.
    show_overlay_versions:
      title: Версии оверлеев
      description: Показывать версии рядом с названиями оверлеев.
    show_package_versions:
      title: Версии пакетов
      description: Показывать версии рядом с названиями пакетов.
    clean_version_labels:
      title: Версии без v
      description: Показывать версии без буквы v в начале.
    show_clock:
      title: Часы
      description: Показывать время в виджете.
    datetime_format:
      title: Формат часов
      description: Как пишется время, в формате strftime. %a %T даёт день недели и время с секундами, %H:%M только часы и минуты. Результат должен уместиться в 19 символов.
    show_soc_temp:
      title: Температура SoC
      description: Показывать в виджете температуру процессора.
    show_pcb_temp:
      title: Температура платы
      description: Показывать в виджете температуру платы.
    show_battery:
      title: Батарея
      description: Показывать в виджете заряд батареи.
    dynamic_widget_colors:
      title: Динамические температуры
      description: Красить температуры по тому, насколько горячо.
    center_widget_alignment:
      title: По центру
      description: Выравнивать виджет по центру его фона, а не по правому краю.
    show_widget_backdrop:
      title: Фон
      description: Рисовать фон под виджетом.
    extended_widget_backdrop:
      title: Короткий фон
      description: Заканчивать фон и границу до края экрана. Меню Ultrahand показывает этот ключ наоборот, как выключенный "Расширенный фон".
    show_widget_border:
      title: Граница
      description: Рисовать границу вокруг виджета.
    dynamic_widget_border:
      title: Динамическая граница
      description: Пускать цвета вдоль границы.
    switch_2_style:
      title: Стиль Switch 2
      description: Рисовать выделение как на Switch 2, скруглённым и с цветами, бегущими по его рамке. Без него выглядит как на первой Switch.
    dynamic_logo:
      title: Динамический логотип
      description: Пускать цвета по логотипу Ultrahand.
    dynamic_tables:
      title: Динамические таблицы
      description: Пускать цвета вдоль границ таблиц.
    selection_bg:
      title: Фон выделения
      description: Заливать выбранный пункт цветом выделения из темы.
    selection_text:
      title: Текст выделения
      description: Красить текст выбранного пункта в его цвет из темы.
    selection_value:
      title: Значение выделения
      description: Красить значение выбранного пункта в его цвет из темы.
    libultrahand_titles:
      title: Цвет заголовков libultrahand
      description: Красить названия оверлеев, собранных на libultrahand, в их собственный цвет из темы.
    libultrahand_versions:
      title: Цвет версий libultrahand
      description: Красить версии оверлеев, собранных на libultrahand, в их собственный цвет из темы.
    package_titles:
      title: Цвет заголовков пакетов
      description: Красить названия пакетов в их собственный цвет из темы.
    package_versions:
      title: Цвет версий пакетов
      description: Красить версии пакетов в их собственный цвет из темы.
    in_package_titles:
      title: Заголовки внутри пакетов
      description: Разрешать пакету красить свой заголовок внутри себя. Без этого у всех пакетов цвет из темы.
    notifications:
      title: Уведомления API
      description: Показывать уведомления, которые другие homebrew-приложения отправляют через Ultrahand.
    notifications_hotkey:
      title: Горячая клавиша API
      description: Удержание минуса несколько секунд включает и выключает уведомления других homebrew-приложений.
    startup_notification:
      title: Уведомление при запуске
      description: Показывать уведомление, когда Ultrahand запускается после загрузки консоли.
    silence_notifications:
      title: Уведомления без звука
      description: Показывать уведомления без их звука.
    max_notifications:
      title: Слоты уведомлений
      description: Сколько уведомлений держится на экране одновременно.

ultrahand_status_monitor: &ultrahand_overlay
  title: Ultrahand, Status Monitor
  description: Как Ultrahand показывает оверлей в списке и запускает его.
  options:
    priority:
      title: Приоритет сортировки
      description: Место оверлея в списке, меньшие числа идут выше. Избранные всё равно стоят перед остальными.
    star:
      title: Избранное
      description: Держать оверлей среди избранных, в начале списка.
    hide:
      title: Скрытый
      description: Убрать оверлей в скрытые.
    use_launch_args:
      title: Аргументы запуска
      description: Запускать оверлей с аргументами ниже.
    launch_args:
      title: Аргументы
      description: С чем запускается оверлей, например --microOverlay для режима Micro у Status Monitor.
    custom_name:
      title: Имя
      description: Имя, которое показывается в списке вместо собственного имени оверлея.
    custom_version:
      title: Версия
      description: Версия, которая показывается в списке вместо собственной версии оверлея.
    key_combo:
      title: Сочетание запуска
      description: Кнопки, которые нужно зажать одновременно, чтобы открыть оверлей сразу, минуя меню, до четырёх. Работает, пока в Ultrahand включены сочетания запуска, и не должно совпадать с сочетанием другого оверлея.
    force_support:
      title: Принудительная поддержка
      description: Разрешить запуск оверлея, даже если Ultrahand помечает его как не собранный под Atmosphere 1.10 и новее.
    modes:
      title: Режимы запуска
      description: Способы запустить оверлей со своими аргументами, у каждого имя и, если нужно, сочетание, которое открывает его сразу. Status Monitor принимает --microOverlay.
      fields:
        label: Имя
        combo: Сочетание
        args: Аргументы

