      title: Источники
      description: Имя, вид сервера и его адрес, например http://192.168.1.47/Nintendo/Switch/. Логин и пароль пишутся прямо в адресе, как в ftp://user:password@192.168.1.24:2121/, поэтому в ссылки источники не попадают.
      fields:
        Name: Имя
        Type: Тип
        URL: Адрес

dbi_local_sources:
  title: Закладки
  description: Пункты главного меню, которые ведут в папки SD-карты.
  options:
