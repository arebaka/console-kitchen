      title: Имя сети
      description: Название точки доступа.
    Password:
      title: Пароль
      description: Пароль точки доступа.
    Use5GHz:
      title: 5 ГГц
      description: Работать на 5 ГГц, а не на 2,4 ГГц.
    Hidden:
      title: Скрытая сеть
      description: Скрывать имя сети, чтобы подключались только те, кто его знает.

dbi_mtp_storages:
  title: Хранилища MTP
  description: Хранилища, которые компьютер видит по MTP.
  options:
    SDCard:
      title: SD Card
