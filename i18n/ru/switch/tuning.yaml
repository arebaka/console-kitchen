    ReportAndroidExtension:
      title: Расширения Android
      description: Сообщать о расширениях Android для MTP. Стоит переключить, если компьютер передаёт медленно или принимает консоль за что-то другое.
    SingleURB:
      title: Передача одиночными URB
      description: Передавать одиночными URB. Гораздо медленнее, но бывает стабильнее.
    BufferSize:
      title: Размер буфера, КБ
      description: Размер буфера передачи MTP.
    NewBufferTimeout:
      title: Тайм-аут передачи, мс
      description: Сколько ждёт передача MTP.
    AutoremoveInstalled:
      title: Убирать установленные файлы
      description: Сообщать компьютеру, что файл, скопированный в хранилище установки, пропал, когда он установлен.
    InitiatorStrictClassFiltering:
      title: Строгий отбор устройств
      description: Принимать только MTP-устройства класса 6/1/1. Некоторым устройствам Xiaomi нужно, чтобы он был выключен.

dbi_ftp:
  title: FTP
