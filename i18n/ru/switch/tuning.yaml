    ReadMT:
      title: Даты файлов
      description: Читать время изменения файлов. Может замедлить большие папки.
    Port:
      title: Порт
      description: Порт сервера на IP-адресе консоли.
    MinPassivePort:
      title: Пассивные порты от
      description: Первый порт пассивного диапазона, 0 - подобрать автоматически.
    MaxPassivePort:
      title: Пассивные порты до
      description: Последний порт пассивного диапазона, 0 - подобрать автоматически.
    CDIR:
      title: Текущая папка как cdir
      description: Отдавать текущую папку в списках как type=cdir.
    ForceUtf8:
      title: Всегда UTF-8
      description: Всегда использовать UTF-8 для имён файлов.
    UseWaitAll:
      title: Ждать все данные
      description: Принимать с опцией WaitAll. Бывает быстрее, но с некоторыми клиентами не работает.

dbi_http:
  title: HTTP
  description: Порт HTTP-сервера DBI и то, как он читает по HTTP.
  options:
