sys_tune:
  title: sys-tune
  description: Воспроизведение фонового музыкального плеера. Он играет файлы MP3, FLAC и WAV с карты, его оверлей открывает папку /music.
  options:
    load_path:
      title: Играть при запуске
      description: Файл или папка на карте, которые начинают играть после загрузки консоли, например /music. Если пусто, плеер запускается молча.
    shuffle:
      title: Перемешивание
      description: Играть треки в случайном порядке.
    repeat:
      title: Повтор
      description: Что повторяется.
      values:
        '0': Ничего
        '1': Один трек
        '2': Все треки
    volume:
      title: Громкость музыки, %
      description: Громкость музыки.
    global_volume:
      title: Громкость игр, %
      description: Громкость игр, которым в оверлее не задана своя.
    title_default:
