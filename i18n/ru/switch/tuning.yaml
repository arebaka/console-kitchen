    Timeout:
      title: Тайм-аут чтения, с
      description: Сколько DBI ждёт данных.
    RetryCount:
      title: Повторы
      description: Сколько раз повторяется неудавшееся чтение, 0 - без ограничения.

dbi_access_point:
  title: Точка доступа
  description: Сеть Wi-Fi, которую консоль сама поднимает для своих серверов FTP и HTTP, чтобы клиенты подключались к ней напрямую.
  options:
