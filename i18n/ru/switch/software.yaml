atmosphere:
  description: Базовая кастомная прошивка (CFW)
  details: Основа для взлома. Открывает доступ к homebrew-приложениям, модам и системным плагинам.

hekate:
  description: Универсальный загрузчик.
  details: Отвечает за бэкап системы, разметку SD-карты, создание emuMMC и запуск пэйлоадов. Содержит графическое меню Nyx и менеджер разделов/NAND.

sys_patch:
  description: Системный модуль для успешной проверки подписей в памяти при загрузке
  details: Позволяет Horizon OS запускать установленные игры и неподписанный софт. Патчи вычисляются на лету под текущую прошивку, после обновления системы ничего обновлять не нужно.
  note: Заменяет классические сигпатчи, которые приходится обновлять под каждую версию HOS.

fusee:
  description: Официальный пэйлоад запуска Atmosphere
  details: Запускает Atmosphere напрямую, минуя Hekate. Пригодится для инжекта через RCM на непатченных Erista.

lockpick_rcm:
  description: Дампер криптографических ключей
  details: Извлекает ключи шифрования консоли (prod.keys / title.keys) на SD-карту. Они нужны для расшифровки игр на ПК, например, для эмуляторов и утилит распаковки.
  note: Оригинальный репозиторий удалён, используется поддерживаемый форк от impeeza.

tegraexplorer:
  description: Файловый менеджер на уровне загрузчика
  details: Работает с файлами SD-карты и разделами eMMC, форматирует SD, дампит прошивки, запускает скрипты. Позволяет спасти данные или сделать сброс системы, если консоль не загружается.

common_problem_resolver:
  description: Пэйлоад для решения типичных проблем загрузки
  details: Отключает системные модули, удаляет установленные темы и снимает атрибут архива с файлов SD-карты, если консоль перестала загружаться после обновления или нового модуля.

hwfly_toolbox:
  description: Пэйлоад для диагностики и обновления чипов HWFLY
  details: Проверяет и обновляет прошивку чипа, сбрасывает его статистику и выводит диагностику.
  note: Полезен только для чипованных консолей (Mariko, OLED, Lite).

picofly_toolbox:
  description: Пэйлоад для диагностики чипов Picofly
  details: Показывает состояние и прошивку чипа RP2040 Picofly и помогает найти проблемы с глитчем.
  note: Полезен только для чипованных консолей (Mariko, OLED, Lite).

missioncontrol:
  description: Подключение геймпадов других консолей по встроенному Bluetooth
  details: Позволяет играть на Switch геймпадами от PlayStation (DualSense, DualShock), Xbox или Wii без дополнительных Bluetooth-адаптеров.

sys_clk:
  description: Системный сервис для разгона и даунклока процессора, видеоядра и оперативной памяти
  details: Разгоняет консоль для повышения FPS в тяжёлых играх или снижает частоты в портативе для экономии батареи.

horizon_oc:
  description: Разгон процессора, видеоядра и оперативной памяти дальше пределов sys-clk
  details: Частоты, напряжения и тайминги памяти настраиваются из своего оверлея. Занимает место sys-clk и подменяет loader и secure monitor Atmosphere, в комплекте форк Status Monitor.
  note: 'Разгон памяти может испортить данные на NAND и SD-карте: сначала сделай бэкапы. С Atmosphere новее той, под которую он собран, CFW загружается только пунктами без него, из More configs.'

nx_fan_control:
  description: Своя кривая вентилятора
  details: Системный модуль, который крутит вентилятор по кривой до десяти точек температуры SoC. Кривая задаётся в его оверлее, там же видны температура и обороты.
  note: 'Форк dominatorul с исправлениями под свежие прошивки: оригинал больше не обновляется.'

saltynx:
  description: Системный модуль для инъекции кода в игры
  details: Перехватывает вызовы игрового рендера, позволяя менять целевую частоту кадров (60 FPS в портативе) и собирать статистику производительности. Обязателен, если планируешь ставить моды производительности.
  note: Необходим для FPSLocker и ReverseNX-RT.

ldn_mitm:
  description: Локальный беспроводной мультиплеер через сеть
  details: Превращает локальную игру в виртуальную LAN-комнату. Позволяет играть в локальный кооператив (например, Mario Kart 8, Monster Hunter Rise) с игроками со всего мира.
  note: Нужен только для игры с другими людьми через LAN play серверы вроде XLink Kai.

sys_con:
  description: Поддержка сторонних USB-геймпадов
  details: Позволяет играть проводными геймпадами Xbox, PlayStation и обычными HID-контроллерами через USB, с настраиваемой раскладкой кнопок.
  note: Форк от o0Zz, оригинал больше не поддерживается.

sysdvr:
  description: Трансляция видео и звука игры на ПК
  details: Передаёт картинку и звук по USB или сети в клиент SysDVR на ПК, для записи или стрима без карты захвата.

sys_ftpd_light:
  description: FTP-сервер в фоне
  details: 'Даёт доступ к SD-карте с ПК по Wi-Fi. Задай логин и пароль в настройках модулей: анонимный доступ опасен.'

sys_tune:
  description: Фоновый музыкальный плеер
  details: Проигрывает MP3, FLAC и WAV с SD-карты поверх игр, управление через оверлей.

fizeau:
  description: Управление цветами экрана
  details: Настраивает цветовую температуру, насыщенность, гамму и яркость экрана, с ночным расписанием. В комплекте оверлей и приложение.

sys_hidplus:
  description: Ввод геймпада с ПК
  details: Позволяет клиенту на ПК передавать нажатия геймпада на консоль по сети, например, для удалённой игры.

ovlmenu:
  description: Загрузчик оверлеев и меню поверх запущенных игр
  details: Ставит nx-ovlloader и Tesla Menu - боковую панель, из которой запускаются оверлеи вроде FPSLocker, Status Monitor или sys-clk поверх игры.
  note: Оверлеям нужен Tesla Menu или Ultrahand.

ultrahand:
  description: Альтернативное меню оверлеев
  details: Современная замена Tesla Menu с темами, пакетами команд и настройками. Работает с теми же оверлеями.
  note: Заменяет Tesla Menu, установить можно только одно из двух.

status_monitor:
  description: Мониторинг FPS, CPU, GPU, RAM, температур и батареи в реальном времени
  details: Показывает компактную полоску или подробную панель поверх игры. Лучшая пара для sys-clk, чтобы следить за температурой при разгоне.

fps_locker:
  description: Оверлей для ограничения частоты кадров в играх
  details: Фиксирует 30, 45 или 60 FPS, отключает динамическое разрешение и применяет патчи для конкретных игр.
  note: Требует SaltyNX.

reversenx_rt:
  description: Переключение игры между режимами портатива и дока на лету
  details: 'Заставляет игру считать, что она запущена в доке или в портативе: чтобы поднять разрешение в портативе или снизить нагрузку в доке.'
  note: Требует SaltyNX.

sysdvr_overlay:
  description: Оверлей управления SysDVR
  details: Переключает режимы SysDVR и показывает его состояние, не выходя из игры.

edizon_overlay:
  description: Оверлей читов
  details: Включает и выключает читы запущенной игры из меню оверлеев.

noled:
  description: Оверлей выключения экрана
  details: Гасит экран, пока игра продолжает работать, например, для стрима или прослушивания музыки.

master_volume:
  description: Оверлей общей громкости
  details: Регулирует громкость сразу всех аудиовыходов, с усилением выше системного максимума и принудительным выводом на динамик.
  note: 'Патчит аудиомодуль каждой версии HOS: после обновления системы ждёт нового релиза.'

bt_audio:
  description: Оверлей Bluetooth-аудио
  details: Подключает уже сопряжённые Bluetooth-наушники и колонки из меню оверлеев, без похода в системные настройки.
  note: Bluetooth-аудио появилось в HOS 13.0.0.

quickntp:
  description: Оверлей синхронизации часов по NTP
  details: Выставляет время консоли по выбранному NTP-серверу и показывает, насколько часы с ним расходятся. Пригодится, когда серверы Nintendo заблокированы и система не может сверить часы сама.

ovl_sysmodules:
  description: Оверлей управления системными модулями
  details: Запускает и останавливает модули на лету и переключает их автозапуск при загрузке системы. Показывает модули, которые описали себя файлом toolbox.json, а так делает большинство.
  note: 'Форк ppkantorski под свежие прошивки: оригинал WerWolv не обновляется с 2023 года.'

alchemist:
  description: Пакет Ultrahand для установки и конвертации модов
  details: Включает и выключает exeFS-патчи и моды контента запущенной игры, конвертирует pchtxt в IPS и читы, скачивает моды из своих репозиториев.

memory_kit:
  description: Пакет Ultrahand для настройки памяти Atmosphere и оверлеев
  details: Задаёт память оверлеев и буферы Ultrahand. Его Memory Hack подменяет ядро Atmosphere сборкой, которая отдаёт системным модулям больше памяти.
  note: Memory Hack выходит под конкретные версии Atmosphere и сам дописывает ключ kernel в пункты hekate. Вариант stripped ломает встроенный браузер.

appstore:
  description: Магазин homebrew-приложений
  details: Поиск, установка и обновление homebrew прямо на консоли. Всё, что Console Kitchen поставила из магазина, будет видно в нём как установленное.

dbi:
  description: Файловый менеджер, установщик игр и MTP-сервер
  details: Подключает консоль к ПК как MTP-устройство через USB с виртуальными папками для установки NSP/NSZ, ставит игры по сети (HTTP, FTP, WebDAV) и управляет установленным контентом и тикетами.
  note: Покрывает всё, что Goldleaf и Tinfoil умеют для локальной установки, быстрее и стабильнее.

dbi_patcher:
  description: Неофициальные переводы DBI на 20+ языков
  details: 'Заменяет DBI сборкой, под которую сделаны переводы, и кладёт рядом translation.bin на языке, выбранном на шаге "DBI". Переводы отстают: новые версии DBI выходят только на русском.'
  note: Автор DBI предупреждает, что пропатченные сборки помечают консоль и со временем начинают сбоить. Используй на свой страх и риск.

tinfoil:
  description: Альтернативный установщик с поддержкой магазинов
  details: Устанавливает контент из сторонних онлайн-магазинов, проверяет хэши файлов, имеет плиточный интерфейс с обложками игр.
  note: 'tinfoil.media блокирует автоматические загрузки, установщик не может его скачать: загрузи вручную.'

goldleaf:
  description: Многофункциональный установщик и менеджер контента
  details: Устанавливает пакеты с SD-карты или по USB через Quark на ПК, управляет установленными играми, тикетами и учётными записями.

jksv:
  description: Менеджер сохранений
  details: Делает резервные копии сохранений на SD-карту, восстанавливает их и переносит в удалённое хранилище.

checkpoint:
  description: Менеджер сохранений
  details: Делает бэкапы и восстанавливает сохранения игр и дополнительные данные, просто и быстро.

aio_updater:
  description: Обновление компонентов CFW, прошивок и читов прямо с консоли
  details: Работает на консоли по сети. Скачивает свежие Atmosphere, Hekate, читы и файлы прошивки, не вынимая SD-карту.

edizon:
  description: Менеджер читов, сканер и редактор оперативной памяти
  details: Читает память запущенной игры, применяет читы, замораживает значения вроде здоровья или патронов и ищет новые чит-коды. В комплекте чит-движок Breeze.

breeze:
  description: Движок читов
  details: Ищет, создаёт и применяет читы с поиском по памяти, от автора EdiZon SE.
  note: EdiZon SE уже включает Breeze.

emuiibo:
  description: Эмулятор виртуальных Amiibo
  details: Игры считывают виртуальные фигурки Amiibo как настоящие, даёт доступ к эксклюзивным скинам и предметам в Zelda, Fire Emblem и Smash Bros. Управление через оверлей из комплекта.

amiigo:
  description: Менеджер Amiibo для emuiibo
  details: Создаёт виртуальные фигурки Amiibo для emuiibo и управляет ими в удобном интерфейсе.
  note: Требует emuiibo.

linkalho:
  description: Офлайн-привязка аккаунта Nintendo
  details: Привязывает профили к фиктивным аккаунтам Nintendo, чтобы игры и приложения, требующие привязанный аккаунт, запускались без выхода в сеть.
  note: Оригинальный репозиторий удалён, используется поддерживаемый форк от impeeza.

nx_shell:
  description: Файловый менеджер
  details: Просмотр, копирование, перемещение, переименование и удаление файлов на SD-карте, распаковка архивов и просмотр изображений.

nx_activity_log:
  description: Подробная замена системного журнала игровой активности
  details: Записывает игровые сессии, строит графики игрового времени по дням, месяцам и годам и экспортирует данные. Полезно для тех, кто любит отслеживать подробную статистику.
  note: Оригинал не обновляется с 2021 года, используется поддерживаемый форк от zdm65477730.

jc_color_swapper:
  description: Смена цветов Joy-Con
  details: Меняет цвета Joy-Con и Pro Controller, записанные в их памяти и отображаемые в главном меню.

nxdumptool:
  description: Дампер картриджей и установленных игр
  details: Снимает дампы картриджей и игр, установленных на SD-карту или eMMC, в XCI, NSP, HFS0, ExeFS и RomFS, вместе с сертификатами и тикетами, на карту или по USB.
  note: 'Ставится rewrite из App Store (nxdt_rw_poc): именно эта ветка сейчас развивается.'

switch_cheats_updater:
  description: Обновление читов для установленных игр
  details: Скачивает читы для установленных игр и картриджей из подборки GBAtemp в atmosphere/contents.
  note: AIO Switch Updater того же автора тоже скачивает читы.

neumann:
  description: Менеджер сохранений
  details: Делает резервные копии сохранений установленных игр на SD-карту и восстанавливает их.

simple_mod_manager:
  description: Менеджер модов
  details: Включает и выключает моды LayeredFS из папки mods на карте для каждой игры, с наборами из нескольких модов сразу.

simple_mod_downloader:
  description: Загрузчик модов с GameBanana
  details: Находит и скачивает моды для установленных игр прямо на консоли, а SimpleModManager их устанавливает.
  note: Требует SimpleModManager.

amiibo_generator:
  description: Генератор всех Amiibo для emuiibo
  details: Разом создаёт виртуальные фигурки всей базы Amiibo для emuiibo. База скачивается из интернета или кладётся вручную в emuiibo/amiibos.json.
  note: Требует emuiibo.

sphaira:
  description: Альтернативное меню homebrew
  details: 'Может заменить hbmenu: запускает homebrew, открывает файлы, ставит приложения из App Store, создаёт форвардеры и скачивает темы с Themezer.'

nxmp:
  description: Медиаплеер
  details: 'Играет видео и музыку большинства форматов на MPV и FFmpeg: с SD-карты, USB-накопителей (FAT, NTFS, EXT4), HTTP- и FTP-серверов и ресиверов Enigma2.'

pplay:
  description: Видеоплеер
  details: Играет большинство видеоформатов со встроенными субтитрами, с SD-карты или по HTTP.

browsenx:
  description: Запуск встроенного браузера
  details: Открывает спрятанный в системе веб-браузер без подмены DNS. Запускается из hbmenu поверх игры, а не из Альбома, HTML5-видео не играет.

lennytube:
  description: YouTube во встроенном браузере
  details: Открывает YouTube во встроенном браузере системы там, где приложение YouTube не запускается, например на забаненной консоли.
  note: С 2019 года YouTube сильно изменился, сайт может уже не открыться.

comicnx:
  description: Браузер nhentai (18+)
  details: Просмотр и чтение комиксов с nhentai.net на консоли.
  note: В архиве с 2020 года и, скорее всего, с нынешним сайтом уже не работает.

daybreak:
  description: Установщик обновлений системы
  details: Устанавливает обновления Horizon OS из папки на SD-карте.
  note: Поставляется вместе с Atmosphere.

nxthemes_installer:
  description: Установщик тем главного меню
  details: Ставит пользовательские темы (.nxtheme) для главного меню, экрана блокировки и других системных апплетов.

themezer:
  description: Магазин тем
  details: Просмотр и загрузка тем с themezer.net прямо на консоли.
  note: Ставит темы через NXThemes Installer.

ulaunch:
  description: Замена главного меню
  details: Заменяет системное главное меню настраиваемым лаунчером с папками и темами.
  note: Подменяет главное меню, темы NXThemes на него не действуют.

moonlight:
  description: Стриминг игр с ПК
  details: Позволяет играть в игры с ПК через Sunshine или NVIDIA GameStream, с поддержкой геймпадов и низкой задержкой.

akira:
  description: Remote Play для PS4 и PS5
  details: Стримит игры PlayStation 4 и 5 на Switch, на основе chiaki-ng.

switchfin:
  description: Клиент Jellyfin
  details: Показывает и проигрывает фильмы и сериалы с твоего сервера Jellyfin, напрямую или с транскодированием.

skynx:
  description: Стриминг игр с ПК
  details: Транслирует игры с ПК со звуком на Switch в 60 FPS и передаёт на ПК до четырёх пар Joy-Con.
  note: На ПК нужен стример для Windows из релизов проекта на GitHub.

switch_remote_play:
  description: Стриминг игр с ПК
  details: Позволяет играть в игры с ПК на Switch по сети, как Steam Link, через стример на Windows.
  note: На ПК нужен стример из релизов проекта на GitHub.

retroarch:
  description: Мультисистемный эмулятор
  details: 'Фронтенд для ядер libretro: NES, SNES, Game Boy, Genesis, PlayStation и десятки других систем в одном приложении.'
  note: Пакет из магазина включает набор ядер.

flycast:
  description: Ядро эмулятора Dreamcast
  details: Эмуляция Sega Dreamcast, Naomi и Atomiswave в виде ядра RetroArch из ночных сборок libretro.
  note: Требует RetroArch.

ppsspp:
  description: Эмулятор PSP
  details: Отдельный порт PPSSPP с аппаратным рендерингом.

melonds:
  description: Эмулятор Nintendo DS
  details: Порт melonDS с поддержкой сенсорного экрана.

noods:
  description: Эмулятор Nintendo DS и GBA
  details: Быстрый эмулятор с точной программной отрисовкой, апскейлом и работой на нескольких ядрах. Для системного меню нужны BIOS и прошивка DS.

desmume:
  description: Эмулятор Nintendo DS
  details: Ранний порт DeSmuME с простым интерфейсом. ROM-ы кладутся в switch/desmume/roms.
  note: melonDS и NooDS ушли гораздо дальше.

mgba:
  description: Эмулятор Game Boy Advance
  details: Быстрый и точный эмулятор Game Boy Advance, Game Boy и Game Boy Color с сохранениями состояния.

psnes:
  description: Эмулятор SNES
  details: Порт Snes9x с сохранениями состояния, масштабированием и шейдерами. ROM-ы кладутся в switch/psnes/roms.

pnes:
  description: Эмулятор NES
  details: На основе Nestopia, с сохранениями состояния, масштабированием и шейдерами. ROM-ы кладутся в switch/pnes/roms.

pfbneo:
  description: Эмулятор аркадных автоматов
  details: FinalBurn Neo для аркадных автоматов, Neo Geo и других систем, с сохранениями состояния и шейдерами.
  note: Раньше назывался pFBA.

scummvm:
  description: Движок классических квестов
  details: Запускает point-and-click квесты и другие классические игры LucasArts, Sierra, Revolution и десятков других студий по их оригинальным файлам данных.

sys_botbase:
  description: Удалённое управление по сети
  details: 'Позволяет программам на ПК читать память и нажимать кнопки по Wi-Fi: основа ботов и автоматизации вроде SysBot.NET.'
  note: Занимает тот же Title ID, что и USB-Botbase, установить можно только один.

usb_botbase:
  description: Удалённое управление по USB
  details: sys-botbase с подключением по USB вместо Wi-Fi.

sys_gdbstub:
  description: Заглушка для отладчика GDB
  details: Позволяет отлаживать приложения на консоли через GDB по сети.

twili:
  description: Монитор отладки homebrew
  details: Собирает вывод и отчёты о падениях homebrew и передаёт их на ПК по USB.
  note: 'Заменяет atmosphere/hbl.nsp своей старой версией: homebrew может перестать запускаться.'
