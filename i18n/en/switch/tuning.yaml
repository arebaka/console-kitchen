logo:
  title: Boot screen
  description: The screen hekate shows while it waits for VOL- to open the menu.
  options:
    bootwait:
      title: Boot screen delay
      description: How long the boot screen is shown (in seconds). A value of 0 hides it completely.
      values:
        '0': 0 s
        '1': 1 s
        '3': 3 s
        '5': 5 s
        '10': 10 s
        '20': 20 s
    noticker:
      title: Hide the boot screen countdown
      description: Do not draw the line showing the time left to enter the menu on a custom boot screen.

hekate:
  title: Hekate
  description: Startup behavior of the bootloader. Its boot entries and boot screen are set on the Launch step.
  options:
    backlight:
      title: Screen brightness
      description: Backlight level in Hekate and Nyx.
    autohosoff:
      title: Power off on wake
      description: What to do if HOS wakes the console via RTC, e.g., during charging.
      values:
        '0': Nothing
        '1': Logo and power off
        '2': Power off immediately
    autonogc:
      title: Cartridge slot protection (nogc)
      description: Applies the nogc patch on unburnt fuses so the card reader firmware is not updated, allowing lower firmwares to read cartridges.
    updater2p:
      title: Hekate as reboot payload
      description: Keeps atmosphere/reboot_payload.bin updated with Hekate, so rebooting from HOS returns to Hekate.
    bootprotect:
      title: Protect bootloader folder
      description: Hides the bootloader folder from HOS to prevent corruption or modification.

nyx:
  title: Nyx
  description: Appearance and behavior of the Hekate graphical interface.
  options:
    themecolor:
      title: Accent color
      description: Highlight color for text.
    themebg:
      title: Background
      description: 'Background color, from #0b0b0b to #c7c7c7.'
    homescreen:
      title: Home screen
      description: The screen opened after startup.
      values:
        '0': Main
        '1': All configs
        '2': Launch
        '3': More configs
    verification:
      title: Backup verification
      description: How backups and NAND restores are verified.
      values:
        '0': 'Off'
        '1': Sparse, fast
        '2': Full SHA256, slow
    entries5col:
      title: Five columns
      description: Show 5 boot entries in a row instead of 4.
    timedst:
      title: Daylight saving time
      description: Adjust the clock for daylight saving time automatically.
    umsemmcrw:
      title: Writable eMMC over USB
      description: Mount eMMC and emuMMC as writable in USB mass storage mode. Careless writes can brick the console.
    jcdisable:
      title: Disable Joy-Cons
      description: Turn off the Joy-Con driver of Nyx completely.
    jcforceright:
      title: Right Joy-Con as pointer
      description: Always use the right Joy-Con as the main pointer.
    bpmpclock:
      title: BPMP clock
      description: Lower it if Nyx hangs or USB mass storage and backup verification fail.
      values:
        '0': Auto
        '1': 589 MHz
        '2': 576 MHz
        '3': 563 MHz
        '4': 544 MHz
        '5': 408 MHz

dns:
  title: Nintendo servers block (DNS-MITM)
  description: Blocks Nintendo servers at the system level. Disables updates, telemetry, and eShop (online gaming will not work).
  options:
    mode:
      title: Mode
      description: Atmosphere telemetry is always blocked unless DNS-MITM is disabled.
      values:
        block: Block all
        default: Telemetry only
        'off': Disable DNS-MITM
    targets:
      title: Apply to
      description: Systems receiving the blocklist.
      values:
        emummc: emuMMC
        sysmmc: sysMMC
    add_defaults:
      title: Atmosphere defaults
      description: Block the built-in telemetry list of Atmosphere in addition to the hosts file.
    debug_log:
      title: Debug log
      description: Log every DNS request to atmosphere/logs/dns_mitm_debug.log.

exosphere:
  title: Exosphere
  description: Serial number blanking. The system sees empty keys and a blank serial number in PRODINFO. Atmosphere developers do not consider this completely safe, as data may be cached elsewhere.
  options:
    blank_prodinfo_emummc:
      title: Blank on emuMMC
      description: Wipe PRODINFO when booting emuMMC.
    blank_prodinfo_sysmmc:
      title: Blank on sysMMC
      description: Wipe PRODINFO when booting sysMMC. Online services will stop working.
    allow_writing_to_cal_sysmmc:
      title: Writable PRODINFO on sysMMC
      description: Lets homebrew edit the calibration data. Atmosphere keeps an encrypted backup, but a bad write can still break the console.
    debugmode:
      title: Kernel debug mode
      description: Tells the kernel that debugging is enabled. Turning it off breaks Atmosphere.
    debugmode_user:
      title: Userland debug mode
      description: Enables debug mode for user processes.
    disable_user_exception_handlers:
      title: Disable exception handlers
      description: Crashes stop being handled gracefully. Support may refuse to help with this on.
    enable_user_pmu_access:
      title: User access to PMU
      description: Gives user processes access to the performance monitoring registers. The effect on official code is unknown.
    enable_mem_mode:
      title: Boot config memory mode
      description: Takes the memory size from the boot config instead of the retail 4 GB cap, for consoles with upgraded RAM.
    log_port:
      title: Log UART port
      description: Serial port of the exosphere log.
      values:
        '0': UART-A
        '1': UART-B
        '2': UART-C
        '3': UART-D
    log_baud_rate:
      title: Log baud rate
      description: Speed of the log UART port, 0 means 115200.
    log_inverted:
      title: Inverted log port
      description: Inverts the signal of the log UART port.

atmosphere:
  title: Atmosphere
  description: Override Horizon OS system settings.
  options:
    upload_enabled:
      title: Error report uploads
      description: Send crash reports to Nintendo.
    usb30_force_enabled:
      title: USB 3.0
      description: Enable USB 3.0 for homebrew. May interfere with 2.4 GHz Wi-Fi and Bluetooth.
    dmnt_cheats_enabled_by_default:
      title: Auto-enable cheats
      description: Automatically apply found cheats when launching a game.
    dmnt_always_save_cheat_toggles:
      title: Remember cheats
      description: Save cheat states and restore them on the next launch.
    enable_external_bluetooth_db:
      title: Shared gamepad pairings
      description: Store Bluetooth pairings on the SD card, shared between sysMMC and emuMMC.
    power_menu_reboot_function:
      title: Power menu reboot
      description: What the "Reboot" button does in the power menu.
      values:
        payload: To Hekate
        normal: Normal
        rcm: To RCM
    fatal_auto_reboot_interval:
      title: Reboot after a crash
      description: Restart the console after a fatal error instead of waiting for a button press.
      values:
        '0': Never
        '5000': 5 s
        '10000': 10 s
        '30000': 30 s
    disable_automatic_report_cleanup:
      title: Keep every error report
      description: Never clean up error reports automatically.
    ease_nro_restriction:
      title: Ease NRO restriction
      description: Relaxes the validation of NRO modules loaded by games and homebrew.
    enable_log_manager:
      title: Log manager
      description: Collects the logs of system modules.
    enable_sd_card_logging:
      title: Logs to SD card
      description: Save the collected logs to the SD card.
    sd_card_log_output_directory:
      title: Log folder
      description: Folder of the logs on the SD card.
    enable_htc:
      title: Host target connection (htc)
      description: Connection with the Nintendo development tools, turns the log manager on as well.
    enable_am_debug_mode:
      title: AM debug mode
      description: The applet manager sees the system as a debug unit.
    enable_hbl_bis_write:
      title: Homebrew writes to system partitions
      description: Allows homebrew to write to the BIS partitions of the eMMC. Dangerous.
    enable_hbl_cal_read:
      title: Homebrew reads PRODINFO
      description: Allows homebrew to read the calibration partition.
    fsmitm_redirect_saves_to_sd:
      title: Saves on SD card
      description: Redirects game saves to the SD card. Experimental, saves can be lost.
    applet_heap_size:
      title: Homebrew memory in applet mode, MiB
      description: Memory of homebrew launched through the Album, 0 uses everything available.
    applet_heap_reservation_size:
      title: Memory kept for other applets, MiB
      description: Stays free for other applets while the memory above is 0.

stratosphere:
  title: Stratosphere
  description: Game card reader protection used when booting through fusee.
  options:
    nogc:
      title: Cartridge slot protection (nogc)
      description: Auto applies it only when needed, like the option of Hekate.
      values:
        auto: Auto
        'on': Always
        'off': Never

hbl:
  title: Homebrew
  description: How to open the hbmenu.
  options:
    album:
      title: Via Album
      description: Opening the Album launches hbmenu; holding the button opens the real Album. If off, it is inverted.
    any_app:
      title: Via any game
      description: Hold the button while launching a game to open hbmenu with full memory access.
    key:
      title: Button
      description: The button to hold for both options above.
    mods_key:
      title: Launch without mods
      description: Hold this button while launching a game to disable its mods.
    cheat_key:
      title: Launch without cheats
      description: Hold this button while launching a game to disable cheats.
    address_space:
      title: Address space
      description: Address space of homebrew launched through a game.
      values:
        '39_bit': 39-bit
        '36_bit': 36-bit
        '32_bit': 32-bit
    path:
      title: Homebrew loader
      description: Path of the homebrew loader on the SD card.

tesla:
  title: Tesla / Ultrahand
  description: Button combo to open the overlay menu. For Ultrahand it goes into its own config as well.
  options:
    key_combo:
      title: Combo
      description: Buttons to press simultaneously.

sys_patch:
  title: sys-patch
  description: Where signature patches are applied.
  options:
    patch_sysmmc:
      title: Patch sysMMC
      description: Apply the patches when booting sysMMC.
    patch_emummc:
      title: Patch emuMMC
      description: Apply the patches when booting emuMMC.
    version_skip:
      title: Skip outdated patterns
      description: Do not try patterns made for older firmware, it speeds up the boot.
    enable_logging:
      title: Log
      description: Write the applied patches to config/sys-patch/log.ini.

missioncontrol:
  title: MissionControl
  description: Third-party Bluetooth controllers.
  options:
    enable_rumble:
      title: Vibration
      description: Rumble support for unofficial controllers.
    enable_motion:
      title: Motion controls
      description: Gyro support for unofficial controllers.
    analog_trigger_activation_threshold:
      title: Trigger threshold, %
      description: How far analog triggers have to be pressed to count as ZL and ZR.
    dualsense_lightbar_brightness:
      title: DualSense lightbar
      description: Brightness from 0 (off) to 9 (full).
    dualsense_enable_player_leds:
      title: DualSense player LEDs
      description: White player indicators below the touchpad.
    dualsense_vibration_intensity:
      title: DualSense vibration
      description: Intensity from 1 (12.5%) to 8 (100%).
    dualsense_adaptive_trigger_travel:
      title: DualSense trigger travel, %
      description: Limits how far the adaptive triggers go, 0 leaves them free. Needs MissionControl 0.16.0 or newer.
    dualshock4_lightbar_brightness:
      title: DualShock 4 lightbar
      description: Brightness from 0 (off) to 9 (full).
    dualshock3_enable_usb_pairing:
      title: DualShock 3 USB pairing
      description: Pair DualShock 3 by cable. Turn it off if you play with it wired through sys-con.
    dualshock3_led_mode:
      title: DualShock 3 LEDs
      description: Pattern of the player LEDs.
      values:
        '0': Switch
        '1': PS3
        '2': Hybrid
    dualshock4_polling_rate:
      title: DualShock 4 polling rate
      description: 0 is the fastest, 16 the slowest, 8 means 125 Hz.
    host_name:
      title: Bluetooth name
      description: Name of the console shown to controllers, empty keeps the system one.
    host_address:
      title: Bluetooth address
      description: MAC address of the console shown to controllers, such as 04:20:69:04:20:69, empty keeps the system one.

sys_con:
  title: sys-con
  description: How sys-con finds USB controllers and shows them to the console. Its config is written whole, with the profiles of controllers sys-con ships, so the ones it added on the console are not kept.
  options:
    mode:
      title: Mode
      description: How controllers reach the console.
      values:
        hiddbg: Virtual pads, the most compatible
        mitm: In place of the HID service
        disabled: Disabled, sys-con does nothing
    discovery_mode:
      title: Discovery
      description: Which USB devices sys-con takes for controllers. Limiting it fixes official controllers connected over USB.
      values:
        '0': Any HID device and Xbox controllers
        '1': Listed devices and Xbox controllers
        '2': Listed devices only
    discovery_vidpid:
      title: Devices to discover
      description: Vendor and product IDs by commas, such as 054c-* for every Sony controller. Up to two along with Xbox controllers, up to three without them.
    auto_add_controller:
      title: Add unknown controllers
      description: Write a controller sys-con sees for the first time into the config, to be set up there.
    polling_timeout_ms:
      title: Polling timeout, ms
      description: How long sys-con waits for the data of a controller before it asks again. It matters for controllers with several interfaces, such as the wireless Xbox 360 one, low values load the processor.
    polling_thread_priority:
      title: Polling thread priority
      description: Priority of the thread that reads controllers, from 24 to 63. A lower number is a higher priority, applications run at 44.
    network_controller:
      title: Network controller
      description: A virtual controller driven over UDP by the networkpad.py script of sys-con, made for testing. Anyone on the same network can press its buttons. Dangerous.
    network_controller_port:
      title: Network controller port
      description: UDP port sys-con listens on.
    log_level:
      title: Log level
      description: How much sys-con writes to its log.
      values:
        '0': Trace
        '1': Debug
        '2': Performance
        '3': Info
        '4': Warning
        '5': Error

status_monitor:
  title: General
  description: Buttons and readings shared by the modes of the on-screen monitor. The modes themselves are set below.
  options:
    key_combo:
      title: Exit combo
      description: Buttons to hold together to leave a mode of the monitor, from one to four.
    touch_screen:
      title: Touch screen
      description: Drag the Mini, FPS and Game Resolutions modes around the screen with a finger. The new place is not saved.
    motion_control:
      title: Motion controls
      description: Move the same modes with the motion of a wireless Joy-Con or a Pro Controller while its combo is held.
    left_joycon_motion_key_combo:
      title: Left Joy-Con combo
      description: Buttons to hold to move a mode with the left Joy-Con, from one to four.
    right_joycon_motion_key_combo:
      title: Right Joy-Con combo
      description: Buttons to hold to move a mode with the right Joy-Con, from one to four.
    pro_controller_motion_key_combo:
      title: Pro Controller combo
      description: Buttons to hold to move a mode with a Pro Controller, from one to four.
    average_gpu_load:
      title: Average GPU load
      description: Average the last five readings of the GPU load. More accurate, at the cost of a little more load on the processor.
    battery_avg_iir_filter:
      title: Battery filter
      description: Take the voltage and current as the battery gauge averages them itself, over a longer time.
    battery_time_left_refreshrate:
      title: Battery estimate refresh, s
      description: How often the time left on the battery is recalculated.
    use_old_fps_average:
      title: Old FPS average
      description: Do not round the average FPS, the way it was before Status Monitor 1.2.2.
    font_cache:
      title: Font cache
      description: Cache glyphs to draw faster.

status_monitor_full:
  title: Full
  description: The mode with every reading in detail, a panel at a side of the screen.
  options:
    refresh_rate:
      title: Refreshes per second
      description: How often the mode is redrawn. Higher values load the processor more, 1 is recommended.
    layer_width_align:
      title: Side of the screen
      description: Where the panel is drawn.
      values:
        left: Left
        right: Right
    show_real_freqs:
      title: Real frequencies
      description: Frequencies the CPU, GPU and RAM really run at. Needs sys-clk.
    show_deltas:
      title: Frequency differences
      description: How far the real frequencies are from the target ones. Needs sys-clk, hidden when both kinds of frequencies are off.
    show_target_freqs:
      title: Target frequencies
      description: Frequencies the CPU, GPU and RAM are set to.
    show_fps:
      title: FPS
      description: Frames per second of the game, counted two ways. Needs SaltyNX.
    show_res:
      title: Resolution
      description: Two most likely internal resolutions of the game. Needs SaltyNX, only for games on the NVN graphics API.
    show_read_speed:
      title: Read speed
      description: How much the game reads from storage per second. Needs SaltyNX.

status_monitor_mini:
  title: Mini
  description: The compact mode, a small panel with a reading per line. The slider next to a color sets its opacity.
  options:
    show:
      title: Readings
      description: What the panel shows. FPS, resolution and read speed need SaltyNX and a running game.
      values:
        TEMP: Temperature
        FAN: Fan
        DRAW: Power
        RES: Resolution
        READ: Read speed
    real_freqs:
      title: Real frequencies
      description: Show the frequencies the CPU, GPU and RAM really run at instead of the target ones. Needs sys-clk.
    replace_MB_with_RAM_load:
      title: RAM load
      description: Show the load of RAM in percent instead of megabytes used. Needs sys-clk.
    refresh_rate:
      title: Refreshes per second
      description: How often the mode is redrawn. Higher values load the processor more, 1 is recommended.
    layer_width_align:
      title: Horizontal position
      description: Side of the screen the panel is drawn at.
      values:
        left: Left
        center: Center
        right: Right
    layer_height_align:
      title: Vertical position
      description: Edge of the screen the panel is drawn at.
      values:
        top: Top
        center: Center
        bottom: Bottom
    handheld_font_size:
      title: Font size, handheld
      description: Size of the text on the screen of the console.
    docked_font_size:
      title: Font size, docked
      description: Size of the text on a TV.
    background_color:
      title: Background
      description: Color of the panel.
    cat_color:
      title: Names
      description: Color of the names of readings on the left.
    text_color:
      title: Values
      description: Color of the readings on the right.

status_monitor_micro:
  title: Micro
  description: The mode of a single line along the top or bottom edge of the screen. The slider next to a color sets its opacity.
  options:
    show:
      title: Readings
      description: What the line shows. Board stands for temperatures and battery power, FPS needs SaltyNX and a running game.
      values:
        BRD: Board
        FAN: Fan
    real_freqs:
      title: Real frequencies
      description: Show the frequencies the CPU, GPU and RAM really run at instead of the target ones. Needs sys-clk.
    replace_GB_with_RAM_load:
      title: RAM load
      description: Show the load of RAM in percent instead of gigabytes used. Needs sys-clk.
    refresh_rate:
      title: Refreshes per second
      description: How often the mode is redrawn. Higher values load the processor more, 1 is recommended.
    layer_height_align:
      title: Edge of the screen
      description: Where the line is drawn.
      values:
        top: Top
        bottom: Bottom
    text_align:
      title: Text alignment
      description: Which side of the line the readings are gathered at.
      values:
        left: Left
        center: Center
        right: Right
    handheld_font_size:
      title: Font size, handheld
      description: Size of the text on the screen of the console.
    docked_font_size:
      title: Font size, docked
      description: Size of the text on a TV.
    background_color:
      title: Background
      description: Color of the line.
    cat_color:
      title: Names
      description: Color of the names of readings.
    text_color:
      title: Values
      description: Color of the readings themselves.

status_monitor_fps_counter:
  title: FPS Counter
  description: The mode with nothing but the FPS of the game. Needs SaltyNX. The slider next to a color sets its opacity.
  options:
    layer_width_align:
      title: Horizontal position
      description: Side of the screen the counter is drawn at.
      values:
        left: Left
        center: Center
        right: Right
    layer_height_align:
      title: Vertical position
      description: Edge of the screen the counter is drawn at.
      values:
        top: Top
        center: Center
        bottom: Bottom
    handheld_font_size:
      title: Font size, handheld
      description: Size of the number on the screen of the console.
    docked_font_size:
      title: Font size, docked
      description: Size of the number on a TV.
    background_color:
      title: Background
      description: Color behind the number.
    text_color:
      title: Text
      description: Color of the number.

status_monitor_fps_graph:
  title: FPS Graph
  description: The mode with a graph of the FPS of the game. Needs SaltyNX. The slider next to a color sets its opacity.
  options:
    layer_width_align:
      title: Horizontal position
      description: Side of the screen the graph is drawn at.
      values:
        left: Left
        center: Center
        right: Right
    layer_height_align:
      title: Vertical position
      description: Edge of the screen the graph is drawn at.
      values:
        top: Top
        center: Center
        bottom: Bottom
    background_color:
      title: Background
      description: Color behind the graph.
    border_color:
      title: Frame
      description: Color of the frame around the graph.
    dashed_line_color:
      title: Center line
      description: Color of the dashed line in the middle of the graph, and of the graph line while FPS holds at a whole value.
    main_line_color:
      title: Graph line
      description: Color of the line of FPS.
    rounded_line_color:
      title: Line at a whole FPS
      description: Meant for the graph line while FPS holds at a whole value. Status Monitor reads this color, but so far draws that line with the color of the center line.
    perfect_line_color:
      title: Line at full and half rate
      description: Color of the graph line while FPS holds at the refresh rate of the screen or half of it, 60 or 30.
    fps_counter_color:
      title: Average FPS
      description: Color of the average FPS drawn behind the graph.
    max_fps_text_color:
      title: Top mark
      description: Color of the top mark of the scale, 60.
    min_fps_text_color:
      title: Bottom mark
      description: Color of the bottom mark of the scale, 0.

status_monitor_game_resolutions:
  title: Game Resolutions
  description: The mode listing the resolutions a game renders at. Needs SaltyNX. The slider next to a color sets its opacity.
  options:
    refresh_rate:
      title: Refreshes per second
      description: How often the mode is redrawn. Higher values load the processor more.
    layer_width_align:
      title: Horizontal position
      description: Side of the screen the panel is drawn at.
      values:
        left: Left
        center: Center
        right: Right
    layer_height_align:
      title: Vertical position
      description: Edge of the screen the panel is drawn at.
      values:
        top: Top
        center: Center
        bottom: Bottom
    background_color:
      title: Background
      description: Color of the panel.
    cat_color:
      title: Headings
      description: Color of the Depth and Viewport headings.
    text_color:
      title: Resolutions
      description: Color of the lists of resolutions.

sys_ftpd_light:
  title: sys-ftpd-light
  description: Login and behavior of the FTP server.
  options:
    user:
      title: Login
      description: User name to connect with.
    password:
      title: Password
      description: Password to connect with.
    anonymous:
      title: Anonymous access
      description: Anyone on the network can connect without a password. Dangerous.
    port:
      title: Port
      description: Port of the server on the IP address of the console.
    pause:
      title: Pause by combo
      description: Allow pausing the server with a button combo.
    keycombo:
      title: Pause combo
      description: Buttons to hold together to pause the server.
    led:
      title: LED on connect
      description: Flash the LED when a client connects.

dbi_patcher:
  title: DBIPatcher
  description: Language of the DBI translation.
  options:
    language:
      title: Language
      description: The translation DBI shows instead of Russian.

dbi_general:
  title: General
  description: How DBI exits, where it keeps saves, logs and dumps, how it lists and browses and where it takes versions from.
  options:
    ExitToHomeScreen:
      title: Exit to the HOME Menu
      description: Exit DBI straight to the HOME Menu instead of hbmenu.
    SavesFolder:
      title: Save backups folder
      description: Folder the backups of saves go to.
    LogEvents:
      title: Log operations
      description: Keep logs of installing, checking integrity and cleaning up.
    LogsFolder:
      title: Logs folder
      description: Folder the logs go to.
    DumpsFolder:
      title: Dumps folder
      description: Folder the dumps of games go to.
    AppSorting:
      title: Sorting of applications
      description: What the list of applications can be sorted by.
      values:
        LastPlayed: Last played
        InstallLocation: Install location
        Size: Size
        Name: Name
    SaveSorting:
      title: Sorting of saves
      description: What the list of saves can be sorted by.
      values:
        AppLastPlayed: Game last played
        AppName: Game name
        UserUid: User
        Size: Size
        Time: Time
    HighlightUpdates:
      title: Highlight updates
      description: Highlight the files with updates of installed titles in the file browsers.
    RotateScreen:
      title: Rotate the screen
      description: Turn the picture upside down.
    RotateJoycon:
      title: Rotate the Joy-Con
      description: Turn the controls over, to match the rotated screen.
    VersionsURL:
      title: Versions list
      description: Address or path on the card of the list of title versions updates are checked against, such as sdmc:/versions.txt.
    TitleDB:
      title: Title database
      description: Address of the titledb JSON DBI takes the data of titles from.
    ROSaveFS:
      title: Read-only saves
      description: Browse the files of saves without writing to them.
    ShowUpdateFromHere:
      title: Update from here
      description: Show "Update all items from here" in the context menu of the file browsers.
    ShowCacheWarmingIndicator:
      title: Cache warming indicator
      description: Show a spinner while DBI caches the installed applications.
    MoveDownAfterX:
      title: Move down after marking
      description: Move the cursor down once an item is marked.
    ScreenIdleTimeout:
      title: Screen idle timeout, s
      description: How long DBI waits without input before it turns the screen off, 0 to keep it on.
    Autorepeat:
      title: Repeat held buttons
      description: Keep moving through a list while a direction is held.
    Secondcursor:
      title: Cursor on both panels
      description: Show the cursor on the inactive panel of the two-panel browser too.
    FoolproofSaveDelete:
      title: Backup before deleting a save
      description: Back a save up before it is deleted.
    TimeShow:
      title: Clock
      description: Show the time in the status line.
    TimeShowSeconds:
      title: Clock with seconds
      description: Show the time with seconds.
    BrowseAppsFromFiles:
      title: Applications by L
      description: Open the list of applications from the file browser with L.
    ValidateSSL:
      title: Validate SSL certificates
      description: Check the certificates of the servers DBI connects to.
    DBIUpdateURL:
      title: DBI update address
      description: Where DBI downloads its own updates from.
    DumpForwarders:
      title: Dump forwarders
      description: Save the forwarders DBI generates into the dumps folder.
    HideFolderJpg:
      title: Hide folder.jpg
      description: Leave folder.jpg files out of the file browser.
    ShowFolderImage:
      title: Folder pictures
      description: Show the picture of a folder in the file browser.
    CustomDNS:
      title: DNS servers
      description: DNS servers for HTTP connections, separated by commas, such as 8.8.8.8, 1.1.1.1. Empty for the ones of the console.
    SmartNetworkConfig:
      title: Optimal socket buffers
      description: Try to allocate socket buffers of the optimal size.
    AutoSaveBackupInterval:
      title: Automatic save backup, days
      description: How often DBI backs the saves up when it starts, 0 to never do it.
    ContentsPath:
      title: Contents folder
      description: Path of the contents folder of Atmosphere.
    ExefsPatchesPath:
      title: ExeFS patches folder
      description: Path of the exefs_patches folder of Atmosphere.

dbi_album:
  title: Album
  description: What DBI files the pictures it puts into the Album under.
  options:
    ApplicationId:
      title: Application
      description: ID of the application the pictures are filed under, the HOME Menu by default.

dbi_filtering:
  title: Filtering
  description: How the filter of the file browser treats folders.
  options:
    FilterFolders:
      title: Filter folders
      description: Apply the filter of the file browser to folders too.
    InheritFilter:
      title: Keep the filter in subfolders
      description: A subfolder opens with the filter of the folder above it.

dbi_activity_log:
  title: Activity log
  description: What the log of play activity lists.
  options:
    HideUnknownUsers:
      title: Hide deleted users
      description: Leave the play sessions of deleted users out of the list.

dbi_main_menu:
  title: Main menu
  description: Items the main menu of DBI shows.
  options:
    BrowseSD:
      title: Browse SD Card
      description: Browse the SD card and install files from it.
    BrowseSystem:
      title: Browse SYSTEM
      description: Browse the SYSTEM partition and copy files from it.
    BrowseUser:
      title: Browse USER
      description: Browse the USER partition and copy files from it.
    USBHost:
      title: Browse USB
      description: Browse USB flash drives and hard drives and install files from them.
    BackendInstall:
      title: Install from DBIbackend
      description: Browse the files of a PC through dbibackend and install them.
    GameCard:
      title: Install from game card
      description: Install the game from the inserted game card.
    Network:
      title: Network sources
      description: Browse the configured network sources and install files from them.
    Local:
      title: SD card shortcuts
      description: Browse the configured folders of the SD card and install files from them.
    BrowseApps:
      title: Installed applications
      description: Browse the installed applications.
    Tickets:
      title: Tickets
      description: View and delete the installed tickets.
    Saves:
      title: Saves
      description: View and delete the saves of games.
    MTP:
      title: MTP responder
      description: Start the MTP responder.
    FTP:
      title: FTP server
      description: Start the FTP server.
    HTTP:
      title: HTTP server
      description: Start the HTTP server.
    Tools:
      title: Tools
      description: The menu of tools.

dbi_applications:
  title: Applications
  description: The list of installed applications.
  options:
    CalculateLFSSize:
      title: Size of LFS mods
      description: Count the size of the LayeredFS mods of applications. Slows the list down.

dbi_install:
  title: Install
  description: What DBI checks and patches while it installs. The patches break the signature of what they change and can make games crash.
  options:
    CheckHash:
      title: Check hashes
      description: Check the hashes of NCA files while installing.
    EnableNSZ:
      title: NSZ and XCZ in applet mode
      description: Allow installing compressed NSZ and XCZ files when DBI runs as an applet.
    CreateLFS:
      title: Create the LFS folder
      description: Create the folder of the title in /atmosphere/contents once it is installed.
    PatchUAC:
      title: Patch account restrictions
      description: Lift the restrictions on user accounts, such as linking. Breaks the signature, games may crash.
    PatchScreenshot:
      title: Patch the screenshot restriction
      description: Allow screenshots where a game forbids them. Breaks the signature, games may crash.
    PatchVideoRec:
      title: Patch the video restriction
      description: Allow video recording where a game forbids it. Breaks the signature, games may crash.
    PatchMasterKeyGeneration:
      title: Patch the master key generation
      description: Patch the key generation of NCA files that ask for a newer system than the installed one. Breaks the signature, games may crash.
    Patch21Names:
      title: Patch names for systems before 21
      description: Patch the compressed names in the NACP of a title when the system is older than 21. Games may crash.
    PatchVersionInMeta:
      title: Patch the required version
      description: Patch the system version the meta NCA of a title requires. Games may crash.

dbi_mtp:
  title: MTP
  description: What the MTP responder shows to the computer and how it transfers.
  options:
    ShowCombinedNSP:
      title: Combined NSP
      description: Show an NSP with the base game, its latest update and every DLC in one multi-title file.
    AddBaseUpdate:
      title: Base and Update suffixes
      description: Add the suffixes [Base] and [Update] to file names.
    ShowMAC:
      title: Mods & cheats folder
      description: Show the virtual folder "Mods & cheats" that leads to the folder of the title in sdmc:/atmosphere/contents.
    MACasTID:
      title: Title ID for Mods & cheats
      description: Name that folder by the ID of the title.
    CustomStorages:
      title: Custom storages
      description: Show the folders of the SD card set as shortcuts as storages of their own.
    TurnOffScreen:
      title: Turn the screen off
      description: Turn the screen off when the MTP mode starts.
    ReportAndroidExtension:
      title: Android extensions
      description: Report the Android extensions of MTP. Worth switching when a computer transfers slowly or takes the console for something else.
    SingleURB:
      title: Single URB transfers
      description: Transfer in single URBs. A lot slower, but can be more stable.
    BufferSize:
      title: Buffer size, KB
      description: Size of the MTP transmission buffer.
    NewBufferTimeout:
      title: Transmission timeout, ms
      description: How long an MTP transmission waits.
    AutoremoveInstalled:
      title: Remove installed files
      description: Tell the computer that a file copied to an install storage is gone once it is installed.
    InitiatorStrictClassFiltering:
      title: Strict device filtering
      description: Take only the MTP devices of class 6/1/1. Some Xiaomi devices need it off.

dbi_ftp:
  title: FTP
  description: The FTP server of DBI.
  options:
    TurnOffScreen:
      title: Turn the screen off
      description: Turn the screen off when the FTP mode starts.
    ReadMT:
      title: File dates
      description: Read the modification times of files. Can slow large folders down.
    Port:
      title: Port
      description: Port of the server on the IP address of the console.
    MinPassivePort:
      title: Passive ports from
      description: The first port of the passive range, 0 to pick it automatically.
    MaxPassivePort:
      title: Passive ports to
      description: The last port of the passive range, 0 to pick it automatically.
    CDIR:
      title: Current folder as cdir
      description: Send the current folder in listings as type=cdir.
    ForceUtf8:
      title: Force UTF-8
      description: Always use UTF-8 for file names.
    UseWaitAll:
      title: Wait for all data
      description: Receive with the WaitAll option. Can be faster, some clients do not work with it.

dbi_http:
  title: HTTP
  description: The port of the HTTP server of DBI and how it reads over HTTP.
  options:
    Port:
      title: Port
      description: Port of the server on the IP address of the console.
    Timeout:
      title: Read timeout, s
      description: How long DBI waits for data.
    RetryCount:
      title: Retries
      description: How many times a failed read is tried again, 0 for no limit.

dbi_access_point:
  title: Access point
  description: A Wi-Fi network the console starts by itself for its FTP and HTTP servers, so clients connect to it directly.
  options:
    UseAP:
      title: Start an access point
      description: Start the network of the console when a server starts.
    SSID:
      title: Network name
      description: Name of the access point.
    Password:
      title: Password
      description: Password of the access point.
    Use5GHz:
      title: 5 GHz
      description: Run on 5 GHz instead of 2.4 GHz.
    Hidden:
      title: Hidden network
      description: Hide the name of the network, so only those who know it connect.

dbi_mtp_storages:
  title: MTP storages
  description: Storages the computer sees over MTP.
  options:
    SDCard:
      title: SD Card
      description: The SD card.
    NandUSER:
      title: Nand USER
      description: The USER partition of the internal memory.
    NandSYSTEM:
      title: Nand SYSTEM
      description: The SYSTEM partition of the internal memory.
    InstalledGames:
      title: Installed games
      description: Installed games, to copy them from the console.
    SDCardInstall:
      title: SD Card install
      description: Files copied here are installed onto the SD card.
    NANDInstall:
      title: NAND install
      description: Files copied here are installed into the internal memory.
    Saves:
      title: Saves
      description: Saves of games.
    Album:
      title: Album
      description: Screenshots and videos of the Album.
    Gamecard:
      title: Gamecard
      description: The inserted game card.

dbi_fb2:
  title: FB2
  description: How DBI shows FB2 books.
  options:
    Theme:
      title: Theme
      description: Colors of the page.
      values:
        Day: Day
        Night: Night
        Sepia: Sepia
        Darkroom: Darkroom
    Hyphenation:
      title: Hyphenation
      description: Break words between lines.
    Orientation:
      title: Orientation
      description: How a page is turned when a book opens.
      values:
        '0': 0°
        '90': 90°
        '180': 180°
        '270': 270°

dbi_network_sources:
  title: Network sources
  description: Servers DBI installs from over the network, the ones its config lists.
  options:
    sources:
      title: Sources
      description: A name, the kind of the server and its address, such as http://192.168.1.47/Nintendo/Switch/. A login and a password go into the address, as in ftp://user:password@192.168.1.24:2121/, so links do not keep the sources.
      fields:
        Name: Name
        Type: Type
        URL: Address

dbi_local_sources:
  title: Local sources
  description: Shortcuts of the main menu to folders of the SD card.
  options:
    sources:
      title: Shortcuts
      description: A name and the folder it opens, such as sdmc:/switch.
      fields:
        Name: Name
        Path: Folder

dbi_mtp_custom_storages:
  title: MTP custom storages
  description: Folders of the SD card the computer sees over MTP as storages of their own.
  options:
    storages:
      title: Storages
      description: A name and the folder it shows, such as sdmc:/switch.
      fields:
        Name: Name
        Path: Folder

dbi_title_name_override:
  title: Title name override
  description: Names DBI shows for titles instead of their own.
  options:
    names:
      title: Names
      description: The ID of a title and the name to show for it.
      fields:
        TitleID: Title ID
        Name: Name

dbi_disabled_titles_to_check_for_updates:
  title: Update checks
  description: Titles DBI leaves out when it checks for updates.
  options:
    BlockAllTitlesWithLFS:
      title: Skip titles with LFS mods
      description: Leave every title with a LayeredFS mod out of the update check.
    titles:
      title: Titles
      description: IDs of the titles to leave out, each with a note of what it is.
      fields:
        TitleID: Title ID
        Name: Note

dbi_locations:
  title: Locations
  description: Servers DBI installs from over the network, the ones it keeps in a file of their own. The file is written only when it lists something.
  options:
    locations:
      title: Locations
      description: A name, the kind of the server and its address, such as http://192.168.1.47/Nintendo/Switch/. A login and a password go into the address, so links do not keep the locations.
      fields:
        Name: Name
        Type: Type
        URL: Address

sys_clk:
  title: sys-clk
  description: Service intervals of sys-clk.
  options:
    poll_interval_ms:
      title: Profile check interval, ms
      description: How often sys-clk checks and applies profiles.
    temp_log_interval_ms:
      title: Temperature log, ms
      description: 0 disables it.
    freq_log_interval_ms:
      title: Frequency log, ms
      description: 0 disables it.
    power_log_interval_ms:
      title: Power log, ms
      description: 0 disables it.
    csv_write_interval_ms:
      title: CSV log, ms
      description: 0 disables it.

ultrahand:
  title: Ultrahand
  description: Language, input, menus, widget, theme, notifications, and features of the overlay menu. A theme and sounds are picked in Ultrahand itself.
  options:
    default_lang:
      title: Language
      description: Language of the menu.
    launch_combos:
      title: Launch combos
      description: Overlays and packages open by button combos of their own, set in their settings.
    swipe_to_open:
      title: Swipe to open
      description: Open the menu with a swipe from the edge of the touch screen.
    swipe_offset:
      title: Swipe offset, px
      description: Moves the zone a swipe starts in this far from the edge of the screen, for screens that miss touches at the very edge. Ultrahand has no such setting in its menus.
    haptic_feedback:
      title: Haptic feedback
      description: Vibrate on navigation.
    stick_navigation:
      title: Stick navigation
      description: Move through the menu with the stick as well as with the D-pad.
    hold_duration:
      title: Hold duration, ms
      description: How long a button is held for the commands that ask for a hold.
    sound_effects:
      title: Sound effects
      description: Sounds of the menu.
    opaque_screenshots:
      title: Opaque screenshots
      description: Screenshots taken with the menu open show it without transparency.
    right_alignment:
      title: Right-side mode
      description: Draw the menu at the right edge of the screen instead of the left one.
    auto_ntp_sync:
      title: NTP sync before downloads
      description: Set the clock from the network before downloads, a wrong time breaks secure connections.
    show_packages:
      title: Packages menu
      description: Show the page of packages next to the page of overlays.
    page_swap:
      title: Page swap
      description: Open the menu on the page of packages, the overlays move to the second page.
    show_user_guide:
      title: User guide
      description: Show the hints about the buttons in the menus.
    show_hidden:
      title: Hidden
      description: Show the entry that opens the list of hidden overlays and packages.
    show_delete:
      title: Delete
      description: Offer to delete an overlay or a package in its settings.
    show_unsupported:
      title: Unsupported overlays
      description: List the overlays that are not built for Horizon OS 21 and newer, with a warning. It matters on those systems only.
    show_overlay_versions:
      title: Overlay versions
      description: Show versions next to the names of overlays.
    show_package_versions:
      title: Package versions
      description: Show versions next to the names of packages.
    clean_version_labels:
      title: Clean versions
      description: Show versions without the leading v.
    show_clock:
      title: Clock
      description: Show the time in the widget.
    datetime_format:
      title: Clock format
      description: How the time is written, in the format of strftime. %a %T gives the day of the week and the time with seconds, %H:%M only hours and minutes. The result has to fit in 19 characters.
    show_soc_temp:
      title: SoC temperature
      description: Show the temperature of the processor in the widget.
    show_pcb_temp:
      title: PCB temperature
      description: Show the temperature of the board in the widget.
    show_battery:
      title: Battery
      description: Show the charge of the battery in the widget.
    dynamic_widget_colors:
      title: Dynamic temperatures
      description: Color the temperatures by how hot it is.
    center_widget_alignment:
      title: Center alignment
      description: Center the widget in its backdrop instead of pushing it to the right edge.
    show_widget_backdrop:
      title: Backdrop
      description: Draw a backdrop behind the widget.
    extended_widget_backdrop:
      title: Short backdrop
      description: End the backdrop and the border before the edge of the screen. The menu of Ultrahand shows this key the other way round, as Extended Backdrop turned off.
    show_widget_border:
      title: Border
      description: Draw a border around the widget.
    dynamic_widget_border:
      title: Dynamic border
      description: Let colors flow along the border.
    switch_2_style:
      title: Switch 2 style
      description: Draw the selection the way the Switch 2 does, rounded and with colors flowing along its frame. Off brings the look of the first Switch.
    dynamic_logo:
      title: Dynamic logo
      description: Let colors run through the Ultrahand logo.
    dynamic_tables:
      title: Dynamic tables
      description: Let colors flow along the borders of tables.
    selection_bg:
      title: Selection background
      description: Fill the selected item with the selection color of the theme.
    selection_text:
      title: Selection text
      description: Give the text of the selected item its color of the theme.
    selection_value:
      title: Selection value
      description: Give the value of the selected item its color of the theme.
    libultrahand_titles:
      title: libultrahand title color
      description: Give the names of overlays built with libultrahand their own color of the theme.
    libultrahand_versions:
      title: libultrahand version color
      description: Give the versions of overlays built with libultrahand their own color of the theme.
    package_titles:
      title: Package title color
      description: Give the names of packages their own color of the theme.
    package_versions:
      title: Package version color
      description: Give the versions of packages their own color of the theme.
    in_package_titles:
      title: In-package titles
      description: Let a package color its title inside itself. Off gives every package the color of the theme.
    notifications:
      title: API notifications
      description: Show the notifications other homebrew sends through Ultrahand.
    notifications_hotkey:
      title: API toggle hotkey
      description: Holding Minus for a few seconds turns the notifications of other homebrew on and off.
    startup_notification:
      title: Startup notification
      description: Show a notification when Ultrahand starts after the console boots.
    silence_notifications:
      title: Silent notifications
      description: Show notifications without their sound.
    max_notifications:
      title: Notification slots
      description: How many notifications stay on the screen at once.

ultrahand_status_monitor: &ultrahand_overlay
  title: Ultrahand, Status Monitor
  description: How Ultrahand lists and starts the overlay.
  options:
    priority:
      title: Sort priority
      description: Place of the overlay in the list, lower numbers go first. Favorites stay ahead of the rest.
    star:
      title: Favorite
      description: Keep the overlay among the favorites, at the top of the list.
    hide:
      title: Hidden
      description: Move the overlay to the hidden ones.
    use_launch_args:
      title: Launch arguments
      description: Start the overlay with the arguments below.
    launch_args:
      title: Arguments
      description: What the overlay is started with, such as --microOverlay for the Micro mode of Status Monitor.
    custom_name:
      title: Name
      description: Name to show in the list instead of the one the overlay has.
    custom_version:
      title: Version
      description: Version to show in the list instead of the one the overlay has.
    key_combo:
      title: Launch combo
      description: Buttons to hold together to open the overlay at once, past the menu, up to four. It works while the launch combos of Ultrahand are on, and no other overlay may have the same one.
    force_support:
      title: Force support
      description: Let the overlay start even when Ultrahand marks it as not built for Atmosphere 1.10 and newer.
    modes:
      title: Launch modes
      description: Ways to start the overlay with arguments of their own, each under a name and, if needed, with a combo that opens it at once. Status Monitor takes --microOverlay.
      fields:
        label: Name
        combo: Combo
        args: Arguments

ultrahand_fps_locker:
  <<: *ultrahand_overlay
  title: Ultrahand, FPSLocker

ultrahand_reversenx_rt:
  <<: *ultrahand_overlay
  title: Ultrahand, ReverseNX-RT

ultrahand_sysdvr_overlay:
  <<: *ultrahand_overlay
  title: Ultrahand, SysDVR Overlay

ultrahand_edizon_overlay:
  <<: *ultrahand_overlay
  title: Ultrahand, EdiZon Overlay

ultrahand_noled:
  <<: *ultrahand_overlay
  title: Ultrahand, noled

ultrahand_master_volume:
  <<: *ultrahand_overlay
  title: Ultrahand, MasterVolume

ultrahand_bt_audio:
  <<: *ultrahand_overlay
  title: Ultrahand, BT_Audio-ovl

ultrahand_quickntp:
  <<: *ultrahand_overlay
  title: Ultrahand, QuickNTP

ultrahand_ovl_sysmodules:
  <<: *ultrahand_overlay
  title: Ultrahand, ovl-sysmodules

ultrahand_sys_clk:
  <<: *ultrahand_overlay
  title: Ultrahand, sys-clk

ultrahand_horizon_oc:
  <<: *ultrahand_overlay
  title: Ultrahand, Horizon OC

ultrahand_nx_fan_control:
  <<: *ultrahand_overlay
  title: Ultrahand, NX-FanControl

ultrahand_ldn_mitm:
  <<: *ultrahand_overlay
  title: Ultrahand, ldn_mitm

ultrahand_sys_tune:
  <<: *ultrahand_overlay
  title: Ultrahand, sys-tune

ultrahand_fizeau:
  <<: *ultrahand_overlay
  title: Ultrahand, Fizeau

ultrahand_emuiibo:
  <<: *ultrahand_overlay
  title: Ultrahand, emuiibo

sys_tune:
  title: sys-tune
  description: Playback of the background music player. It plays MP3, FLAC and WAV files of the card, its overlay opens the /music folder.
  options:
    load_path:
      title: Play on start
      description: A file or a folder of the card that plays once the console boots, such as /music. Empty to start silent.
    shuffle:
      title: Shuffle
      description: Play the tracks in random order.
    repeat:
      title: Repeat
      description: What is repeated.
      values:
        '0': Nothing
        '1': One track
        '2': All tracks
    volume:
      title: Music volume, %
      description: Volume of the music.
    global_volume:
      title: Game volume, %
      description: Volume of the games that have no volume of their own set in the overlay.
    title_default:
      title: Play in games
      description: The music goes on when a game starts. The overlay also sets it for every game apart.

jksv:
  title: General
  description: Settings of the save manager, the same ones its settings menu keeps. Favorites and the blacklist are set in JKSV itself.
  options:
    WorkingDirectory:
      title: Output folder
      description: Folder of the card the backups go to.
    IncludeDeviceSaves:
      title: Device saves with users
      description: List the saves shared by every user among the saves of each user.
    AutoBackupOnRestore:
      title: Backup on restore
      description: Back the save up before a backup is restored over it.
    AutoNameBackups:
      title: Name backups automatically
      description: Name new backups without asking on the keyboard.
    AutoUploadToRemote:
      title: Upload backups
      description: Upload new backups to the remote storage and delete them from the card. It takes the WebDAV server below or Google Drive set up on the console.
    KeepLocalBackups:
      title: Keep local backups
      description: Leave uploaded backups on the card as well.
    AlwaysUseTitleID:
      title: Application IDs as folder names
      description: Name the folders of backups by application IDs instead of titles.
    EnglishSafeTitles:
      title: English titles in paths
      description: Prefer the American English title of a game for the name of its folder.
    HoldForDeletion:
      title: Hold to delete
      description: Deleting a backup takes holding A for three seconds.
    HoldForRestoration:
      title: Hold to restore
      description: Restoring a backup takes holding A for three seconds.
    HoldForOverWrite:
      title: Hold to overwrite
      description: Overwriting a backup takes holding A for three seconds.
    OnlyListMountable:
      title: Only saves that open
      description: List only the save data JKSV manages to open when it starts.
    ListAccountSystemSaves:
      title: Account system saves
      description: List the system saves tied to an account.
    AllowSystemSaveWriting:
      title: Write to system saves
      description: Allow restoring system saves and writing to the partitions of the NAND. Dangerous.
    ExportToZip:
      title: Export to ZIP
      description: Pack backups into ZIP archives instead of folders.
    ZipCompressionLevel:
      title: ZIP compression
      description: From 0, stored as it is, to 9. Lower levels pack faster and save less space.
    TitleSortType:
      title: Order of games
      description: How the list of games is sorted.
      values:
        '0': Alphabetically
        '1': Most played
        '2': Last played
    JKSMTextMode:
      title: Text menus
      description: List games as text, like JKSM on the 3DS does, instead of a grid of icons.
    ForceEnglish:
      title: English interface
      description: Use English instead of the language of the system.
    ShowDevice:
      title: Device saves
      description: Load and show the save data shared by every user.
    ShowBCAT:
      title: BCAT saves
      description: Load and show BCAT data, which games use to deliver content and events between updates.
    ShowCache:
      title: Cache saves
      description: Load and show cache data, where games keep DLC and other things.
    ShowSystem:
      title: System saves
      description: Load and show the save data of the system.
    EnableTrash:
      title: Trash bin
      description: Move the backups deleted from the card to the _TRASH_ folder instead of deleting them for good.
    UIAnimationScaling:
      title: Animation scaling
      description: Speed of transitions, lower is faster. 1 makes them instant.

jksv_webdav:
  title: WebDAV
  description: A WebDAV server JKSV keeps backups on.
  options:
    origin:
      title: Server
      description: Address of the server with its protocol, such as https://example.com. Empty to leave WebDAV off.
    basepath:
      title: Folder
      description: Path of the folder on the server the backups go to.
    username:
      title: Login
      description: User name to connect with. Empty for a server open to everyone.
    password:
      title: Password
      description: Password to connect with.

amiigo:
  title: Amiigo
  description: How Amiigo creates virtual amiibo for emuiibo.
  options:
    categoryMode:
      title: Folder of new amiibo
      description: Where in emuiibo/amiibo a created amiibo goes.
      values:
        '0': The root
        '1': By game
        '2': By amiibo series
        '3': The folder open in Amiigo
    useRandomisedUUID:
      title: Random UUID
      description: Created amiibo change their UUID at every scan, so a game that takes an amiibo once a day takes it again.
    saveAmiiboImages:
      title: Amiibo images
      description: Download the pictures of created amiibo for the emuiibo overlay. Experimental, a big picture may crash the overlay.
