  description: Сервери, з яких DBI встановлює через мережу, ті, що він зберігає в окремому файлі. Файл записується, лише коли в ньому щось є.
  options:
    locations:
      title: Розташування
      description: Ім’я, вид сервера та його адреса, наприклад http://192.168.1.47/Nintendo/Switch/. Логін і пароль пишуться просто в адресі, тому до посилань розташування не потрапляють.
      fields:
        Name: Ім’я
        Type: Тип
        URL: Адреса

sys_clk:
  title: sys-clk
  description: Службові інтервали sys-clk.
  options:
