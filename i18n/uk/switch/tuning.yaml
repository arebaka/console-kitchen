      description: Переглядати й видаляти збереження ігор.
    MTP:
      title: MTP-з’єднання
      description: Запускати MTP-з’єднання.
    FTP:
      title: FTP-сервер
      description: Запускати FTP-сервер.
    HTTP:
      title: HTTP-сервер
      description: Запускати HTTP-сервер.
    Tools:
      title: Інструменти
      description: Меню інструментів.

dbi_applications:
  title: Встановлені ігри
  description: Список встановлених застосунків.
  options:
    CalculateLFSSize:
      title: Розмір модів LFS
      description: Рахувати розмір модів LayeredFS у застосунків. Сповільнює список.

dbi_install:
  title: Встановлення
  description: Що DBI перевіряє й патчить під час встановлення. Патчі ламають підпис того, що змінюють, і ігри можуть вилітати.
  options:
    CheckHash:
      title: Перевіряти хеші
      description: Перевіряти хеші файлів NCA під час встановлення.
    EnableNSZ:
      title: NSZ і XCZ у режимі аплету
      description: Дозволити встановлення стиснених файлів NSZ і XCZ, коли DBI запущено як аплет.
    CreateLFS:
      title: Створювати теку LFS
      description: Створювати теку гри в /atmosphere/contents після встановлення.
    PatchUAC:
      title: Патчити обмеження акаунтів
      description: Знімати обмеження для акаунтів користувачів, наприклад прив’язку. Ламає підпис, ігри можуть вилітати.
    PatchScreenshot:
      title: Патчити заборону скриншотів
      description: Дозволяти скриншоти там, де гра їх забороняє. Ламає підпис, ігри можуть вилітати.
    PatchVideoRec:
      title: Патчити заборону відео
      description: Дозволяти запис відео там, де гра його забороняє. Ламає підпис, ігри можуть вилітати.
    PatchMasterKeyGeneration:
      title: Патчити покоління майстер-ключа
      description: Патчити покоління ключа у файлів NCA, яким потрібна система, новіша за встановлену. Ламає підпис, ігри можуть вилітати.
    Patch21Names:
      title: Патчити назви для систем до 21
      description: Патчити стиснені назви в NACP гри, коли версія системи нижча за 21. Ігри можуть вилітати.
    PatchVersionInMeta:
      title: Патчити потрібну версію
      description: Патчити версію системи, якої вимагає meta NCA гри. Ігри можуть вилітати.

dbi_mtp:
  title: MTP
  description: Що MTP-з’єднання показує комп’ютеру і як передає дані.
  options:
    ShowCombinedNSP:
      title: Об’єднаний NSP
      description: Показувати NSP із грою, її останнім оновленням і всіма DLC в одному файлі.
    AddBaseUpdate:
      title: Суфікси Base і Update
      description: Додавати до імен файлів суфікси [Base] і [Update].
    ShowMAC:
      title: Тека Mods & cheats
      description: Показувати віртуальну теку "Mods & cheats", яка веде до теки гри в sdmc:/atmosphere/contents.
    MACasTID:
      title: ID гри для Mods & cheats
      description: Називати цю теку за ID гри.
    CustomStorages:
      title: Користувацькі сховища
      description: Показувати теки SD-карти, задані закладками, як окремі сховища.
    TurnOffScreen:
      title: Вимикати екран
      description: Вимикати екран під час запуску режиму MTP.
    ReportAndroidExtension:
      title: Розширення Android
      description: Повідомляти про розширення Android для MTP. Варто перемкнути, якщо комп’ютер передає повільно або сприймає консоль за щось інше.
    SingleURB:
      title: Передача одиночними URB
      description: Передавати одиночними URB. Значно повільніше, але буває стабільніше.
    BufferSize:
      title: Розмір буфера, КБ
      description: Розмір буфера передачі MTP.
    NewBufferTimeout:
      title: Тайм-аут передачі, мс
      description: Скільки чекає передача MTP.
    AutoremoveInstalled:
      title: Прибирати встановлені файли
      description: Повідомляти комп’ютеру, що файл, скопійований у сховище встановлення, зник, коли його встановлено.
    InitiatorStrictClassFiltering:
      title: Суворий відбір пристроїв
      description: Приймати лише MTP-пристрої класу 6/1/1. Деяким пристроям Xiaomi потрібно, щоб його було вимкнено.

dbi_ftp:
  title: FTP
  description: FTP-сервер DBI.
  options:
    TurnOffScreen:
      title: Вимикати екран
      description: Вимикати екран під час запуску режиму FTP.
    ReadMT:
      title: Дати файлів
      description: Читати час зміни файлів. Може сповільнити великі теки.
    Port:
      title: Порт
      description: Порт сервера на IP-адресі консолі.
    MinPassivePort:
      title: Пасивні порти від
      description: Перший порт пасивного діапазону, 0 - підібрати автоматично.
    MaxPassivePort:
      title: Пасивні порти до
      description: Останній порт пасивного діапазону, 0 - підібрати автоматично.
    CDIR:
      title: Поточна тека як cdir
      description: Віддавати поточну теку у списках як type=cdir.
    ForceUtf8:
      title: Завжди UTF-8
      description: Завжди використовувати UTF-8 для імен файлів.
    UseWaitAll:
      title: Чекати всі дані
      description: Приймати з опцією WaitAll. Буває швидше, але з деякими клієнтами не працює.

dbi_http:
  title: HTTP
  description: Порт HTTP-сервера DBI і те, як він читає через HTTP.
  options:
    Port:
      title: Порт
      description: Порт сервера на IP-адресі консолі.
    Timeout:
      title: Тайм-аут читання, с
      description: Скільки DBI чекає даних.
    RetryCount:
      title: Повтори
      description: Скільки разів повторюється невдале читання, 0 - без обмеження.

dbi_access_point:
  title: Точка доступу
  description: Мережа Wi-Fi, яку консоль сама піднімає для своїх серверів FTP і HTTP, щоб клієнти підключалися до неї напряму.
  options:
    UseAP:
      title: Запускати точку доступу
      description: Піднімати мережу консолі, коли запускається сервер.
    SSID:
      title: Ім’я мережі
      description: Назва точки доступу.
    Password:
      title: Пароль
      description: Пароль точки доступу.
    Use5GHz:
      title: 5 ГГц
      description: Працювати на 5 ГГц, а не на 2,4 ГГц.
    Hidden:
      title: Прихована мережа
      description: Приховувати ім’я мережі, щоб підключалися лише ті, хто його знає.

dbi_mtp_storages:
  title: Сховища MTP
  description: Сховища, які комп’ютер бачить через MTP.
  options:
    SDCard:
      title: SD Card
      description: SD-карта.
    NandUSER:
      title: Nand USER
      description: Розділ USER внутрішньої пам’яті.
    NandSYSTEM:
      title: Nand SYSTEM
      description: Розділ SYSTEM внутрішньої пам’яті.
    InstalledGames:
      title: Installed games
      description: Встановлені ігри, щоб копіювати їх із консолі.
    SDCardInstall:
      title: SD Card install
      description: Скопійовані сюди файли встановлюються на SD-карту.
    NANDInstall:
      title: NAND install
      description: Скопійовані сюди файли встановлюються у внутрішню пам’ять.
    Saves:
      title: Saves
      description: Збереження ігор.
    Album:
      title: Album
      description: Скриншоти й відео з Альбому.
    Gamecard:
      title: Gamecard
      description: Вставлений картридж.

dbi_fb2:
  title: FB2
  description: Як DBI показує книги FB2.
