      description: 0 вимикає його.
    power_log_interval_ms:
      title: Журнал живлення, мс
      description: 0 вимикає його.
    csv_write_interval_ms:
      title: Журнал CSV, мс
      description: 0 вимикає його.

ultrahand:
  title: Ultrahand
  description: Мова, ввід, меню, віджет, тема, сповіщення і функції меню оверлеїв. Тема і звуки вибираються в самому Ultrahand.
  options:
    default_lang:
      title: Мова
      description: Мова меню.
    launch_combos:
      title: Комбінації запуску
      description: Оверлеї й пакети відкриваються власними комбінаціями кнопок, заданими в їхніх налаштуваннях.
    swipe_to_open:
      title: Відкриття свайпом
      description: Відкривати меню свайпом від краю сенсорного екрана.
    swipe_offset:
      title: Відступ свайпу, пікс.
      description: Зсуває зону, у якій починається свайп, на стільки від краю екрана. Знадобиться, якщо екран пропускає дотики біля самого краю. У меню Ultrahand такого налаштування немає.
    haptic_feedback:
      title: Вібровідгук
      description: Вібрація під час переміщення по меню.
    stick_navigation:
      title: Навігація стіком
      description: Переміщатися по меню не лише хрестовиною, а й стіком.
    hold_duration:
      title: Час утримання, мс
      description: Скільки треба тримати кнопку в командах, які просять утримання.
    sound_effects:
      title: Звуки
      description: Звуки меню.
    opaque_screenshots:
      title: Непрозорі знімки екрана
      description: На знімках екрана, зроблених із відкритим меню, воно виглядає непрозорим.
    right_alignment:
      title: Меню праворуч
      description: Малювати меню біля правого краю екрана, а не біля лівого.
    auto_ntp_sync:
      title: Синхронізація NTP перед завантаженнями
      description: Звіряти годинник із мережею перед завантаженням файлів, неправильний час ламає захищені з’єднання.
    show_packages:
      title: Меню пакетів
      description: Показувати сторінку пакетів поруч зі сторінкою оверлеїв.
    page_swap:
      title: Зміна сторінок
      description: Відкривати меню на сторінці пакетів, оверлеї переходять на другу.
    show_user_guide:
      title: Інструкція
      description: Показувати в меню підказки щодо кнопок.
    show_hidden:
      title: Приховане
      description: Показувати пункт, який відкриває список прихованих оверлеїв і пакетів.
    show_delete:
      title: Видалення
      description: Пропонувати видалення оверлея або пакета в його налаштуваннях.
    show_unsupported:
      title: Непідтримувані оверлеї
      description: Показувати оверлеї, не зібрані під Horizon OS 21 і новіші, з попередженням. Важливо лише на таких системах.
    show_overlay_versions:
      title: Версії оверлеїв
      description: Показувати версії поруч із назвами оверлеїв.
    show_package_versions:
      title: Версії пакетів
      description: Показувати версії поруч із назвами пакетів.
    clean_version_labels:
      title: Версії без v
      description: Показувати версії без літери v на початку.
    show_clock:
      title: Годинник
      description: Показувати час у віджеті.
    datetime_format:
      title: Формат годинника
      description: Як пишеться час, у форматі strftime. %a %T дає день тижня й час із секундами, %H:%M лише години й хвилини. Результат має вміститися в 19 символів.
    show_soc_temp:
      title: Температура SoC
      description: Показувати у віджеті температуру процесора.
    show_pcb_temp:
      title: Температура плати
      description: Показувати у віджеті температуру плати.
    show_battery:
      title: Батарея
      description: Показувати у віджеті заряд батареї.
    dynamic_widget_colors:
      title: Динамічні температури
      description: Фарбувати температури залежно від того, наскільки гаряче.
    center_widget_alignment:
      title: По центру
      description: Вирівнювати віджет по центру його фону, а не за правим краєм.
    show_widget_backdrop:
      title: Фон
      description: Малювати фон під віджетом.
    extended_widget_backdrop:
      title: Короткий фон
      description: Закінчувати фон і рамку до краю екрана. Меню Ultrahand показує цей ключ навпаки, як вимкнений "Розширений фон".
    show_widget_border:
      title: Рамка
      description: Малювати рамку навколо віджета.
    dynamic_widget_border:
      title: Динамічна рамка
      description: Пускати кольори вздовж рамки.
    switch_2_style:
      title: Стиль Switch 2
      description: Малювати виділення як на Switch 2, заокругленим і з кольорами, що біжать його рамкою. Без нього виглядає як на першій Switch.
    dynamic_logo:
      title: Динамічний логотип
      description: Пускати кольори по логотипу Ultrahand.
    dynamic_tables:
      title: Динамічні таблиці
      description: Пускати кольори вздовж рамок таблиць.
    selection_bg:
      title: Фон виділення
      description: Заливати вибраний пункт кольором виділення з теми.
    selection_text:
      title: Текст виділення
      description: Фарбувати текст вибраного пункту в його колір із теми.
    selection_value:
      title: Значення виділення
      description: Фарбувати значення вибраного пункту в його колір із теми.
    libultrahand_titles:
      title: Колір заголовків libultrahand
      description: Фарбувати назви оверлеїв, зібраних на libultrahand, у їхній власний колір із теми.
    libultrahand_versions:
      title: Колір версій libultrahand
      description: Фарбувати версії оверлеїв, зібраних на libultrahand, у їхній власний колір із теми.
    package_titles:
      title: Колір заголовків пакетів
      description: Фарбувати назви пакетів у їхній власний колір із теми.
    package_versions:
      title: Колір версій пакетів
      description: Фарбувати версії пакетів у їхній власний колір із теми.
    in_package_titles:
      title: Заголовки всередині пакетів
      description: Дозволяти пакету фарбувати свій заголовок усередині себе. Без цього в усіх пакетів колір із теми.
    notifications:
      title: Сповіщення API
      description: Показувати сповіщення, які інші homebrew-застосунки надсилають через Ultrahand.
    notifications_hotkey:
      title: Гаряча клавіша API
      description: Утримання мінуса кілька секунд вмикає й вимикає сповіщення інших homebrew-застосунків.
    startup_notification:
      title: Сповіщення під час запуску
      description: Показувати сповіщення, коли Ultrahand запускається після завантаження консолі.
    silence_notifications:
      title: Сповіщення без звуку
      description: Показувати сповіщення без їхнього звуку.
    max_notifications:
      title: Слоти сповіщень
      description: Скільки сповіщень тримається на екрані одночасно.

ultrahand_status_monitor: &ultrahand_overlay
  title: Ultrahand, Status Monitor
  description: Як Ultrahand показує оверлей у списку й запускає його.
  options:
    priority:
      title: Пріоритет сортування
      description: Місце оверлея у списку, менші числа йдуть вище. Обрані однаково стоять перед рештою.
    star:
      title: Обране
      description: Тримати оверлей серед обраних, на початку списку.
    hide:
      title: Прихований
      description: Прибрати оверлей до прихованих.
    use_launch_args:
      title: Аргументи запуску
      description: Запускати оверлей з аргументами нижче.
    launch_args:
      title: Аргументи
      description: З чим запускається оверлей, наприклад --microOverlay для режиму Micro у Status Monitor.
    custom_name:
      title: Ім’я
      description: Ім’я, яке показується у списку замість власного імені оверлея.
    custom_version:
      title: Версія
      description: Версія, яка показується у списку замість власної версії оверлея.
    key_combo:
      title: Комбінація запуску
      description: Кнопки, які треба затиснути одночасно, щоб відкрити оверлей одразу, оминаючи меню, до чотирьох. Працює, поки в Ultrahand увімкнено комбінації запуску, і не має збігатися з комбінацією іншого оверлея.
    force_support:
      title: Примусова підтримка
      description: Дозволити запуск оверлея, навіть якщо Ultrahand позначає його як не зібраний під Atmosphere 1.10 і новіші.
    modes:
      title: Режими запуску
      description: Способи запустити оверлей зі своїми аргументами, у кожного ім’я та, якщо треба, комбінація, яка відкриває його одразу. Status Monitor приймає --microOverlay.
      fields:
        label: Ім’я
        combo: Комбінація
        args: Аргументи

