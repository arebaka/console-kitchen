sys_tune:
  title: sys-tune
  description: Відтворення фонового музичного плеєра. Він грає файли MP3, FLAC і WAV із карти, його оверлей відкриває теку /music.
  options:
    load_path:
      title: Грати під час запуску
      description: Файл або тека на карті, які починають грати після завантаження консолі, наприклад /music. Якщо порожньо, плеєр запускається мовчки.
    shuffle:
      title: Перемішування
      description: Грати треки у випадковому порядку.
    repeat:
      title: Повтор
      description: Що повторюється.
      values:
        '0': Нічого
        '1': Один трек
        '2': Усі треки
    volume:
      title: Гучність музики, %
      description: Гучність музики.
    global_volume:
      title: Гучність ігор, %
      description: Гучність ігор, яким в оверлеї не задано власну.
    title_default:
      title: Грати в іграх
      description: Музика продовжує грати, коли запускається гра. В оверлеї це задається й для кожної гри окремо.

jksv:
  title: Загальні
  description: Налаштування менеджера збережень, ті самі, що зберігає його меню налаштувань. Обране й чорний список задаються в самому JKSV.
  options:
    WorkingDirectory:
      title: Тека бекапів
      description: Тека на карті, куди складаються бекапи.
    IncludeDeviceSaves:
      title: Збереження пристрою в користувачів
      description: Показувати збереження, спільні для всіх користувачів, серед збережень кожного з них.
    AutoBackupOnRestore:
      title: Бекап перед відновленням
      description: Робити бекап збереження перед тим, як відновити поверх нього інший.
    AutoNameBackups:
      title: Автоматичні імена
      description: Називати нові бекапи без запиту на клавіатурі.
    AutoUploadToRemote:
      title: Вивантаження бекапів
      description: Вивантажувати нові бекапи у віддалене сховище й видаляти їх із карти. Потрібен сервер WebDAV нижче або Google Drive, налаштований на консолі.
    KeepLocalBackups:
      title: Лишати бекапи на карті
      description: Вивантажені бекапи лишаються й на карті.
    AlwaysUseTitleID:
      title: ID застосунків в іменах тек
      description: Називати теки бекапів за ID застосунків, а не за назвами.
    EnglishSafeTitles:
      title: Англійські назви в шляхах
      description: Брати для імені теки назву гри американською англійською.
    HoldForDeletion:
      title: Утримання для видалення
      description: Щоб видалити бекап, треба три секунди тримати A.
    HoldForRestoration:
      title: Утримання для відновлення
      description: Щоб відновити бекап, треба три секунди тримати A.
    HoldForOverWrite:
      title: Утримання для перезапису
      description: Щоб перезаписати бекап, треба три секунди тримати A.
    OnlyListMountable:
      title: Лише збереження, що відкриваються
      description: Показувати лише ті збереження, які JKSV вдається відкрити під час запуску.
    ListAccountSystemSaves:
      title: Системні збереження облікових записів
      description: Показувати системні збереження, прив’язані до облікового запису.
    AllowSystemSaveWriting:
      title: Запис у системні збереження
      description: Дозволити відновлення системних збережень і запис у розділи NAND. Небезпечно.
    ExportToZip:
      title: Експорт у ZIP
      description: Пакувати бекапи в архіви ZIP, а не складати теками.
    ZipCompressionLevel:
      title: Стиснення ZIP
      description: Від 0, без стиснення, до 9. Низькі рівні пакують швидше, але заощаджують менше місця.
    TitleSortType:
      title: Порядок ігор
      description: Як відсортовано список ігор.
      values:
        '0': За алфавітом
        '1': За часом у грі
        '2': За останнім запуском
    JKSMTextMode:
      title: Текстові меню
      description: Показувати ігри списком, як JKSM на 3DS, а не сіткою іконок.
    ForceEnglish:
      title: Англійський інтерфейс
      description: Використовувати англійську, а не мову системи.
    ShowDevice:
      title: Збереження пристрою
      description: Завантажувати й показувати збереження, спільні для всіх користувачів.
    ShowBCAT:
      title: Збереження BCAT
      description: Завантажувати й показувати дані BCAT, через які ігри отримують контент і події між оновленнями.
    ShowCache:
      title: Збереження кешу
      description: Завантажувати й показувати дані кешу, де ігри тримають DLC та інше.
    ShowSystem:
      title: Системні збереження
      description: Завантажувати й показувати збереження системи.
    EnableTrash:
      title: Кошик
      description: Переміщати видалені з карти бекапи в теку _TRASH_, а не видаляти їх назавжди.
    UIAnimationScaling:
      title: Швидкість анімацій
      description: Тривалість переходів, що менше, то швидше. За 1 вони миттєві.

jksv_webdav:
  title: WebDAV
  description: Сервер WebDAV, на якому JKSV зберігає бекапи.
  options:
    origin:
      title: Сервер
      description: Адреса сервера разом із протоколом, наприклад https://example.com. Якщо порожньо, WebDAV вимкнено.
    basepath:
      title: Тека
      description: Шлях до теки на сервері, куди складаються бекапи.
    username:
      title: Логін
      description: Ім’я користувача для підключення. Лиши порожнім для сервера, відкритого всім.
    password:
      title: Пароль
      description: Пароль для підключення.

amiigo:
  title: Amiigo
  description: Як Amiigo створює віртуальні amiibo для emuiibo.
  options:
    categoryMode:
      title: Тека нових amiibo
      description: Куди в emuiibo/amiibo потрапляє створена amiibo.
      values:
        '0': У корінь
        '1': За іграми
        '2': За серіями amiibo
        '3': У теку, відкриту в Amiigo
    useRandomisedUUID:
      title: Випадковий UUID
      description: Створені amiibo змінюють UUID під час кожного сканування, і гра, яка приймає amiibo раз на день, приймає її знову.
    saveAmiiboImages:
      title: Картинки amiibo
      description: Завантажувати картинки створених amiibo для оверлея emuiibo. Експериментально, велика картинка може покласти оверлей.
