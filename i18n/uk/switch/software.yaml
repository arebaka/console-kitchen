atmosphere:
  description: Базова кастомна прошивка (CFW)
  details: Основа для зламу. Відкриває доступ до homebrew-застосунків, модів і системних плагінів.

hekate:
  description: Універсальний завантажувач
  details: Відповідає за бекап системи, розмітку SD-карти, створення emuMMC і запуск пейлоадів. Містить графічне меню Nyx і менеджер розділів/NAND.

sys_patch:
  description: Системний модуль для успішної перевірки підписів у пам’яті під час завантаження
  details: Дає Horizon OS змогу запускати встановлені ігри й непідписаний софт. Патчі обчислюються на льоту під поточну прошивку, після оновлення системи нічого оновлювати не потрібно.
  note: Замінює класичні сигпатчі, які доводиться оновлювати під кожну версію HOS.

fusee:
  description: Офіційний пейлоад запуску Atmosphere
  details: Запускає Atmosphere напряму, оминаючи Hekate. Знадобиться для інжекту через RCM на непатчених Erista.

lockpick_rcm:
  description: Дампер криптографічних ключів
  details: Витягує ключі шифрування консолі (prod.keys / title.keys) на SD-карту. Вони потрібні для розшифрування ігор на ПК, наприклад для емуляторів і утиліт розпакування.
  note: Оригінальний репозиторій видалено, використовується підтримуваний форк від impeeza.

tegraexplorer:
  description: Файловий менеджер на рівні завантажувача
  details: Працює з файлами SD-карти й розділами eMMC, форматує SD, дампить прошивки, запускає скрипти. Дає змогу врятувати дані або скинути систему, якщо консоль не завантажується.

common_problem_resolver:
  description: Пейлоад для розв’язання типових проблем завантаження
  details: Вимикає системні модулі, видаляє встановлені теми й знімає атрибут архіву з файлів SD-карти, якщо консоль перестала завантажуватися після оновлення або нового модуля.

hwfly_toolbox:
  description: Пейлоад для діагностики й оновлення чипів HWFLY
  details: Перевіряє й оновлює прошивку чипа, скидає його статистику й виводить діагностику.
  note: Корисний лише для чипованих консолей (Mariko, OLED, Lite).

picofly_toolbox:
  description: Пейлоад для діагностики чипів Picofly
  details: Показує стан і прошивку чипа RP2040 Picofly та допомагає знайти проблеми з глітчем.
  note: Корисний лише для чипованих консолей (Mariko, OLED, Lite).

missioncontrol:
  description: Підключення геймпадів інших консолей через вбудований Bluetooth
  details: Дає змогу грати на Switch геймпадами від PlayStation (DualSense, DualShock), Xbox або Wii без додаткових Bluetooth-адаптерів.

sys_clk:
  description: Системний сервіс для розгону й даунклоку процесора, відеоядра та оперативної пам’яті
  details: Розганяє консоль для підвищення FPS у важких іграх або знижує частоти в портативному режимі для економії батареї.

horizon_oc:
  description: Розгін процесора, відеоядра та оперативної пам’яті далі за межі sys-clk
  details: Частоти, напруги й таймінги пам’яті налаштовуються з власного оверлея. Займає місце sys-clk і підміняє loader та secure monitor Atmosphere, у комплекті форк Status Monitor.
  note: 'Розгін пам’яті може зіпсувати дані на NAND і SD-карті: спершу зроби бекапи. З Atmosphere, новішою за ту, під яку його зібрано, CFW завантажується лише пунктами без нього, з More configs.'

nx_fan_control:
  description: Власна крива вентилятора
  details: Системний модуль, що крутить вентилятор за кривою до десяти точок температури SoC. Крива задається в його оверлеї, там же видно температуру й оберти.
  note: 'Форк dominatorul з виправленнями під свіжі прошивки: оригінал більше не оновлюється.'

saltynx:
  description: Системний модуль для ін’єкції коду в ігри
  details: Перехоплює виклики ігрового рендера, дозволяючи змінювати цільову частоту кадрів (60 FPS у портативному режимі) і збирати статистику продуктивності. Обов’язковий, якщо плануєш ставити моди продуктивності.
  note: Потрібен для FPSLocker і ReverseNX-RT.

ldn_mitm:
  description: Локальний бездротовий мультиплеєр через мережу
  details: Перетворює локальну гру на віртуальну LAN-кімнату. Дає змогу грати в локальний кооператив (наприклад, Mario Kart 8, Monster Hunter Rise) з гравцями з усього світу.
  note: Потрібен лише для гри з іншими людьми через LAN play сервери на кшталт XLink Kai.

sys_con:
  description: Підтримка сторонніх USB-геймпадів
  details: Дає змогу грати дротовими геймпадами Xbox, PlayStation і звичайними HID-контролерами через USB, з налаштовуваною розкладкою кнопок.
  note: Форк від o0Zz, оригінал більше не підтримується.

sysdvr:
  description: Трансляція відео й звуку гри на ПК
  details: Передає картинку й звук через USB або мережу в клієнт SysDVR на ПК, для запису чи стриму без карти захоплення.

sys_ftpd_light:
  description: FTP-сервер у фоні
  details: 'Дає доступ до SD-карти з ПК через Wi-Fi. Задай логін і пароль у налаштуваннях модулів: анонімний доступ небезпечний.'

sys_tune:
  description: Фоновий музичний плеєр
  details: Відтворює MP3, FLAC і WAV із SD-карти поверх ігор, керування через оверлей.

fizeau:
  description: Керування кольорами екрана
  details: Налаштовує колірну температуру, насиченість, гаму та яскравість екрана, з нічним розкладом. У комплекті оверлей і застосунок.

sys_hidplus:
  description: Введення геймпада з ПК
  details: Дає змогу клієнту на ПК передавати натискання геймпада на консоль через мережу, наприклад для віддаленої гри.

ovlmenu:
  description: Завантажувач оверлеїв і меню поверх запущених ігор
  details: Ставить nx-ovlloader і Tesla Menu - бічну панель, з якої поверх гри запускаються оверлеї на кшталт FPSLocker, Status Monitor або sys-clk.
  note: Оверлеям потрібен Tesla Menu або Ultrahand.

ultrahand:
  description: Альтернативне меню оверлеїв
  details: Сучасна заміна Tesla Menu з темами, пакетами команд і налаштуваннями. Працює з тими самими оверлеями.
  note: Замінює Tesla Menu, встановити можна лише одне з двох.

status_monitor:
  description: Моніторинг FPS, CPU, GPU, RAM, температур і батареї в реальному часі
  details: Показує компактну смужку або детальну панель поверх гри. Найкраща пара для sys-clk, щоб стежити за температурою під час розгону.

fps_locker:
  description: Оверлей для обмеження частоти кадрів в іграх
  details: Фіксує 30, 45 або 60 FPS, вимикає динамічну роздільність і застосовує патчі для конкретних ігор.
  note: Потребує SaltyNX.

reversenx_rt:
  description: Перемикання гри між портативним режимом і доком на льоту
  details: 'Змушує гру вважати, що її запущено в доці або в портативному режимі: щоб підняти роздільність у портативі чи знизити навантаження в доці.'
  note: Потребує SaltyNX.

sysdvr_overlay:
  description: Оверлей керування SysDVR
  details: Перемикає режими SysDVR і показує його стан, не виходячи з гри.

edizon_overlay:
  description: Оверлей читів
  details: Вмикає й вимикає чити запущеної гри з меню оверлеїв.

noled:
  description: Оверлей вимкнення екрана
  details: Гасить екран, поки гра продовжує працювати, наприклад для стриму чи прослуховування музики.

master_volume:
  description: Оверлей загальної гучності
  details: Регулює гучність одразу всіх аудіовиходів, з підсиленням понад системний максимум і примусовим виведенням на динамік.
  note: 'Патчить аудіомодуль кожної версії HOS: після оновлення системи чекає нового релізу.'

bt_audio:
  description: Оверлей Bluetooth-аудіо
  details: Підключає вже сполучені Bluetooth-навушники й колонки з меню оверлеїв, без переходу в системні налаштування.
  note: Bluetooth-аудіо з’явилося в HOS 13.0.0.

quickntp:
  description: Оверлей синхронізації годинника через NTP
  details: Виставляє час консолі за вибраним NTP-сервером і показує, наскільки годинник із ним розходиться. Стане в пригоді, коли сервери Nintendo заблоковано й система не може звірити годинник сама.

ovl_sysmodules:
  description: Оверлей керування системними модулями
  details: Запускає й зупиняє модулі на льоту та перемикає їхній автозапуск під час завантаження системи. Показує модулі, що описали себе файлом toolbox.json, а так робить більшість.
  note: 'Форк ppkantorski під свіжі прошивки: оригінал WerWolv не оновлюється з 2023 року.'

alchemist:
  description: Пакет Ultrahand для встановлення й конвертації модів
  details: Вмикає й вимикає exeFS-патчі та моди контенту запущеної гри, конвертує pchtxt в IPS і чити, завантажує моди зі своїх репозиторіїв.

memory_kit:
  description: Пакет Ultrahand для налаштування пам’яті Atmosphere та оверлеїв
  details: Задає пам’ять оверлеїв і буфери Ultrahand. Його Memory Hack підміняє ядро Atmosphere збіркою, що віддає системним модулям більше пам’яті.
  note: Memory Hack виходить під конкретні версії Atmosphere і сам дописує ключ kernel у пункти hekate. Варіант stripped ламає вбудований браузер.

appstore:
  description: Магазин homebrew-застосунків
  details: Пошук, встановлення й оновлення homebrew просто на консолі. Усе, що Console Kitchen поставила з магазину, буде видно в ньому як встановлене.

dbi:
  description: Файловий менеджер, інсталятор ігор і MTP-сервер
  details: Підключає консоль до ПК як MTP-пристрій через USB з віртуальними теками для встановлення NSP/NSZ, ставить ігри через мережу (HTTP, FTP, WebDAV) і керує встановленим контентом і тікетами.
  note: Покриває все, що Goldleaf і Tinfoil вміють для локального встановлення, швидше й стабільніше.

dbi_patcher:
  description: Неофіційні переклади DBI 20+ мовами
  details: 'Замінює DBI збіркою, під яку зроблено переклади, і кладе поруч translation.bin мовою, вибраною на кроці "DBI". Переклади відстають: нові версії DBI виходять лише російською.'
  note: Автор DBI попереджає, що пропатчені збірки позначають консоль і з часом починають збоїти. Використовуй на власний ризик.

tinfoil:
  description: Альтернативний інсталятор з підтримкою магазинів
  details: Встановлює контент зі сторонніх онлайн-магазинів, перевіряє хеші файлів, має плитковий інтерфейс з обкладинками ігор.
  note: 'tinfoil.media блокує автоматичні завантаження, інсталятор не може його завантажити: завантаж вручну.'

goldleaf:
  description: Багатофункціональний інсталятор і менеджер контенту
  details: Встановлює пакети з SD-карти або через USB за допомогою Quark на ПК, керує встановленими іграми, тікетами й обліковими записами.

jksv:
  description: Менеджер збережень
  details: Робить резервні копії збережень на SD-карту, відновлює їх і переносить у віддалене сховище.

checkpoint:
  description: Менеджер збережень
  details: Робить бекапи й відновлює збереження ігор і додаткові дані, просто й швидко.

aio_updater:
  description: Оновлення компонентів CFW, прошивок і читів просто з консолі
  details: Працює на консолі через мережу. Завантажує свіжі Atmosphere, Hekate, чити й файли прошивки, не виймаючи SD-карту.

edizon:
  description: Менеджер читів, сканер і редактор оперативної пам’яті
  details: Читає пам’ять запущеної гри, застосовує чити, заморожує значення на кшталт здоров’я чи набоїв і шукає нові чит-коди. У комплекті чит-рушій Breeze.

breeze:
  description: Рушій читів
  details: Шукає, створює й застосовує чити з пошуком по пам’яті, від автора EdiZon SE.
  note: EdiZon SE уже містить Breeze.

emuiibo:
  description: Емулятор віртуальних Amiibo
  details: Ігри зчитують віртуальні фігурки Amiibo як справжні, це дає доступ до ексклюзивних скінів і предметів у Zelda, Fire Emblem і Smash Bros. Керування через оверлей з комплекту.

amiigo:
  description: Менеджер Amiibo для emuiibo
  details: Створює віртуальні фігурки Amiibo для emuiibo й керує ними в зручному інтерфейсі.
  note: Потребує emuiibo.

linkalho:
  description: Офлайн-прив’язка облікового запису Nintendo
  details: Прив’язує профілі до фіктивних облікових записів Nintendo, щоб ігри й застосунки, які потребують прив’язаного облікового запису, запускалися без виходу в мережу.
  note: Оригінальний репозиторій видалено, використовується підтримуваний форк від impeeza.

nx_shell:
  description: Файловий менеджер
  details: Перегляд, копіювання, переміщення, перейменування й видалення файлів на SD-карті, розпакування архівів і перегляд зображень.

nx_activity_log:
  description: Детальна заміна системного журналу ігрової активності
  details: Записує ігрові сесії, будує графіки ігрового часу за днями, місяцями й роками та експортує дані. Корисно для тих, хто любить відстежувати детальну статистику.
  note: Оригінал не оновлюється з 2021 року, використовується підтримуваний форк від zdm65477730.

jc_color_swapper:
  description: Зміна кольорів Joy-Con
  details: Змінює кольори Joy-Con і Pro Controller, записані в їхній пам’яті й показані в головному меню.

nxdumptool:
  description: Дампер картриджів і встановлених ігор
  details: Знімає дампи картриджів та ігор, встановлених на SD-карту або eMMC, у XCI, NSP, HFS0, ExeFS і RomFS, разом із сертифікатами й тікетами, на карту або через USB.
  note: 'Ставиться rewrite з App Store (nxdt_rw_poc): саме ця гілка зараз розвивається.'

switch_cheats_updater:
  description: Оновлення читів для встановлених ігор
  details: Завантажує чити для встановлених ігор і картриджів з добірки GBAtemp в atmosphere/contents.
  note: AIO Switch Updater того самого автора теж завантажує чити.

neumann:
  description: Менеджер збережень
  details: Робить резервні копії збережень встановлених ігор на SD-карту й відновлює їх.

simple_mod_manager:
  description: Менеджер модів
  details: Вмикає й вимикає моди LayeredFS з теки mods на карті для кожної гри, з наборами з кількох модів одразу.

simple_mod_downloader:
  description: Завантажувач модів з GameBanana
  details: Знаходить і завантажує моди для встановлених ігор просто на консолі, а SimpleModManager їх встановлює.
  note: Потребує SimpleModManager.

amiibo_generator:
  description: Генератор усіх Amiibo для emuiibo
  details: Разом створює віртуальні фігурки всієї бази Amiibo для emuiibo. Базу завантажує з інтернету, або її кладуть вручну в emuiibo/amiibos.json.
  note: Потребує emuiibo.

sphaira:
  description: Альтернативне меню homebrew
  details: 'Може замінити hbmenu: запускає homebrew, відкриває файли, ставить застосунки з App Store, створює форвардери й завантажує теми з Themezer.'

nxmp:
  description: Медіаплеєр
  details: 'Відтворює відео й музику більшості форматів на MPV і FFmpeg: з SD-карти, USB-накопичувачів (FAT, NTFS, EXT4), HTTP- і FTP-серверів і ресиверів Enigma2.'

pplay:
  description: Відеоплеєр
  details: Відтворює більшість відеоформатів із вбудованими субтитрами, з SD-карти або через HTTP.

browsenx:
  description: Запуск вбудованого браузера
  details: Відкриває схований у системі веб-браузер без підміни DNS. Запускається з hbmenu поверх гри, а не з Альбому, HTML5-відео не відтворює.

lennytube:
  description: YouTube у вбудованому браузері
  details: Відкриває YouTube у вбудованому браузері системи там, де застосунок YouTube не запускається, наприклад на забаненій консолі.
  note: З 2019 року YouTube сильно змінився, сайт може вже не відкритися.

comicnx:
  description: Браузер nhentai (18+)
  details: Перегляд і читання коміксів з nhentai.net на консолі.
  note: В архіві з 2020 року й, найімовірніше, з нинішнім сайтом уже не працює.

daybreak:
  description: Інсталятор оновлень системи
  details: Встановлює оновлення Horizon OS з теки на SD-карті.
  note: Постачається разом з Atmosphere.

nxthemes_installer:
  description: Інсталятор тем головного меню
  details: Ставить користувацькі теми (.nxtheme) для головного меню, екрана блокування та інших системних аплетів.

themezer:
  description: Магазин тем
  details: Перегляд і завантаження тем з themezer.net просто на консолі.
  note: Ставить теми через NXThemes Installer.

ulaunch:
  description: Заміна головного меню
  details: Замінює системне головне меню налаштовуваним лаунчером з теками й темами.
  note: Підміняє головне меню, теми NXThemes на нього не діють.

moonlight:
  description: Стримінг ігор з ПК
  details: Дає змогу грати в ігри з ПК через Sunshine або NVIDIA GameStream, з підтримкою геймпадів і низькою затримкою.

akira:
  description: Remote Play для PS4 і PS5
  details: Стримить ігри PlayStation 4 і 5 на Switch, на основі chiaki-ng.

switchfin:
  description: Клієнт Jellyfin
  details: Показує й відтворює фільми й серіали з твого сервера Jellyfin, напряму або з транскодуванням.

skynx:
  description: Стримінг ігор з ПК
  details: Транслює ігри з ПК зі звуком на Switch у 60 FPS і передає на ПК до чотирьох пар Joy-Con.
  note: На ПК потрібен стример для Windows з релізів проєкту на GitHub.

switch_remote_play:
  description: Стримінг ігор з ПК
  details: Дає змогу грати в ігри з ПК на Switch через мережу, як Steam Link, за допомогою стримера на Windows.
  note: На ПК потрібен стример з релізів проєкту на GitHub.

retroarch:
  description: Мультисистемний емулятор
  details: 'Фронтенд для ядер libretro: NES, SNES, Game Boy, Genesis, PlayStation і десятки інших систем в одному застосунку.'
  note: Пакет з магазину містить набір ядер.

flycast:
  description: Ядро емулятора Dreamcast
  details: Емуляція Sega Dreamcast, Naomi й Atomiswave як ядро RetroArch з нічних збірок libretro.
  note: Потребує RetroArch.

ppsspp:
  description: Емулятор PSP
  details: Окремий порт PPSSPP з апаратним рендерингом.

melonds:
  description: Емулятор Nintendo DS
  details: Порт melonDS з підтримкою сенсорного екрана.

noods:
  description: Емулятор Nintendo DS і GBA
  details: Швидкий емулятор з точним програмним рендерингом, апскейлом і роботою на кількох ядрах. Для системного меню потрібні BIOS і прошивка DS.

desmume:
  description: Емулятор Nintendo DS
  details: Ранній порт DeSmuME з простим інтерфейсом. ROM-и кладуться в switch/desmume/roms.
  note: melonDS і NooDS пішли значно далі.

mgba:
  description: Емулятор Game Boy Advance
  details: Швидкий і точний емулятор Game Boy Advance, Game Boy і Game Boy Color зі збереженнями стану.

psnes:
  description: Емулятор SNES
  details: Порт Snes9x зі збереженнями стану, масштабуванням і шейдерами. ROM-и кладуться в switch/psnes/roms.

pnes:
  description: Емулятор NES
  details: На основі Nestopia, зі збереженнями стану, масштабуванням і шейдерами. ROM-и кладуться в switch/pnes/roms.

pfbneo:
  description: Емулятор аркадних автоматів
  details: FinalBurn Neo для аркадних автоматів, Neo Geo та інших систем, зі збереженнями стану й шейдерами.
  note: Раніше називався pFBA.

scummvm:
  description: Рушій класичних квестів
  details: Запускає point-and-click квести та інші класичні ігри LucasArts, Sierra, Revolution і десятків інших студій з їхніх оригінальних файлів даних.

sys_botbase:
  description: Віддалене керування через мережу
  details: 'Дає змогу програмам на ПК читати пам’ять і натискати кнопки через Wi-Fi: основа ботів і автоматизації на кшталт SysBot.NET.'
  note: Займає той самий Title ID, що й USB-Botbase, встановити можна лише один.

usb_botbase:
  description: Віддалене керування через USB
  details: sys-botbase з підключенням через USB замість Wi-Fi.

sys_gdbstub:
  description: Заглушка для налагоджувача GDB
  details: Дає змогу налагоджувати застосунки на консолі через GDB по мережі.

twili:
  description: Монітор налагодження homebrew
  details: Збирає вивід і звіти про падіння homebrew та передає їх на ПК через USB.
  note: 'Замінює atmosphere/hbl.nsp своєю старою версією: homebrew може перестати запускатися.'
