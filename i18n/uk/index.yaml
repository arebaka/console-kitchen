      handheld_charging: Заряджання
      handheld_charging_usb: Заряджання через USB
      handheld_charging_official: Офіційна зарядка
    modules:
      cpu: CPU
      gpu: GPU
      mem: RAM
    stock: штатно
    mhz: МГц
  appearance:
    title: Оформлення
    description: 'Екран завантаження, фон Nyx та іконки пунктів меню. Вибери з галереї або завантаж своє: картинку буде сконвертовано у формат, який очікує hekate, і вбудовано в інсталятори.'
    targets:
      bootlogo:
        title: Екран завантаження
        description: 'bootloader/bootlogo.bmp до 1280×720: картинка на весь екран або логотип по центру, решту hekate заливає кольором її лівого верхнього пікселя. Файл зберігається повернутим під портретний екран. hekate показує екран завантаження перед автозавантаженням, поки триває його затримка, під час запуску з меню його немає. Пункт може мати власний екран: він з’явиться, коли автозавантаження запускає цей пункт.'
      background:
