  launch:
    title: Меню запуску
    description: 'Пункти меню Launch у hekate: режими, в яких завантажується консоль, і пейлоади. Кожен пункт стає секцією bootloader/hekate_ipl.ini з ключами, показаними під ним.'
    modes: Режими завантаження
    entries:
      emummc: 'Atmosphere на emuMMC, копії системи на SD-карті. Системна NAND лишається чистою: основний режим для homebrew та ігор.'
      sysmmc: Atmosphere на системній NAND. Усе, що зроблено тут, лишається в самій консолі.
      stock: 'Оригінальна прошивка системної NAND через hekate, без патчів ядра й модулів CFW: найближче до недоторканої консолі.'
    emummcEntry: Atmosphere на emuMMC з теки emuMMC/{folder}.
    emummcs: 'Інші emuMMC завантажуються власними пунктами за текою в emuMMC/: SD01, RAW2 і так далі. hekate знаходить лише emuMMC, які створив або переніс сам.'
    addEmuMMC: Додати emuMMC
    remove: Прибрати
    overrides:
      cal0blank: Маскувати PRODINFO
      usb3force: USB 3.0
      memmode: Режим пам’яті з boot config
    asConfigured: як у налаштуваннях
    overridesDescription: 'Перемикачі під пунктом задають ключі Exosphère лише для нього: вони перекривають exosphere.ini з кроку "Безпека" і system_settings.ini з кроку "CFW". Варіант "як у налаштуваннях" ключ не пише.'
    spares: Запуск без модулів
    sparesDescription: 'Пункти в More configs, які завантажують CFW без того, що hekate підвантажує для компонента: його KIP і secure monitor. Виручать, коли з ними система не стартує, наприклад після оновлення Atmosphere.'
    payloads: Пейлоади
    payloadsDescription: Інструменти, що запускаються замість системи. Кожен вибраний пейлоад отримує власний пункт у меню.
    autoboot: Автозавантаження
    autobootDescription: Пункт, який hekate завантажує після екрана завантаження. Затиснута під час нього VOL- перерве автозавантаження й відкриє меню.
    menu: Меню
  system:
    title: Налаштування CFW
    description: Завантажувач hekate, меню Nyx і системні налаштування Atmosphere. Кожна опція відповідає справжньому ключу конфігурації, значення за замовчуванням збігаються із заданими розробниками.
    reset: СКИНУТИ
    'on': увімк
    'off': вимк
    add: Додати
    remove: Прибрати
  security:
    title: Безпека
    description: 'Що консоль повідомляє Nintendo: блокування їхніх серверів і дані консолі, які бачить система. Тут же налагоджувальні налаштування монітора безпеки Exosphère.'
  sysmodules:
    title: Системні модулі
    description: Налаштування вибраних системних модулів. Тут лише компоненти з перевіреним форматом конфігурації.
  overlays:
    title: Оверлеї
    description: Налаштування меню оверлеїв і вибраних оверлеїв. Тут лише компоненти з перевіреним форматом конфігурації.
  status_monitor:
    title: Status Monitor
    description: Конфіг екранного монітора, його комбінації та показники, далі вигляд кожного з його режимів.
  dbi:
    title: DBI
    description: Переклад DBI та його конфіг, група налаштувань на секцію, зі списками мережевих джерел, закладок і назв ігор.
  jksv:
    title: JKSV
    description: Налаштування менеджера збережень і сервера WebDAV, на якому він зберігає бекапи.
  amiibo:
    title: Amiibo
    description: Налаштування вибраних інструментів для amiibo.
  plugins:
    title: Плагіни
    description: Де завантажується кожен вибраний плагін. ARK читає список із SEPLUGINS/PLUGINS.TXT, його менеджер плагінів у XMB потім вмикає й вимикає їх.
