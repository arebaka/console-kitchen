atmosphere:
  github:
    repo: Atmosphere-NX/Atmosphere
    asset: ^atmosphere-.*\.zip$

hekate:
  # Only GitHub: taken from the App Store, the installer would skip the payloads below
  github:
    - repo: CTCaer/hekate
      asset: ^hekate_ctcaer_[0-9.]+_Nyx_[0-9.]+\.zip$
    - repo: CTCaer/hekate
      asset: ^hekate_ctcaer_[0-9.]+\.bin$
      path: atmosphere/reboot_payload.bin
    - repo: CTCaer/hekate
      asset: ^hekate_ctcaer_[0-9.]+\.bin$
      path: payload.bin
      modchip: true

