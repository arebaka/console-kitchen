dns:
  targets:
    mode:
      - block
  add_defaults:
    mode:
      - block
      - default
  debug_log:
    mode:
      - block
      - default

atmosphere:
  enable_sd_card_logging:
    enable_log_manager: true
  sd_card_log_output_directory:
    enable_log_manager: true

sys_ftpd_light:
  keycombo:
    pause: true

sys_con:
  discovery_vidpid:
    discovery_mode:
      - 1
      - 2
  network_controller_port:
    network_controller: true

status_monitor:
  left_joycon_motion_key_combo:
    motion_control: true
  right_joycon_motion_key_combo:
    motion_control: true
  pro_controller_motion_key_combo:
    motion_control: true

ultrahand:
  swipe_offset:
    swipe_to_open: true
  page_swap:
    show_packages: true
  show_package_versions:
    show_packages: true
  datetime_format:
    show_clock: true
  dynamic_widget_border:
    show_widget_border: true

# Every overlay in the list of Ultrahand has the same options
ultrahand_status_monitor: &ultrahand_overlay
  launch_args:
    use_launch_args: true
ultrahand_fps_locker: *ultrahand_overlay
ultrahand_reversenx_rt: *ultrahand_overlay
ultrahand_sysdvr_overlay: *ultrahand_overlay
ultrahand_edizon_overlay: *ultrahand_overlay
ultrahand_noled: *ultrahand_overlay
ultrahand_master_volume: *ultrahand_overlay
ultrahand_bt_audio: *ultrahand_overlay
ultrahand_quickntp: *ultrahand_overlay
ultrahand_ovl_sysmodules: *ultrahand_overlay
ultrahand_sys_clk: *ultrahand_overlay
ultrahand_horizon_oc: *ultrahand_overlay
ultrahand_nx_fan_control: *ultrahand_overlay
ultrahand_ldn_mitm: *ultrahand_overlay
ultrahand_sys_tune: *ultrahand_overlay
ultrahand_fizeau: *ultrahand_overlay
ultrahand_emuiibo: *ultrahand_overlay

dbi_general:
  TimeShowSeconds:
    TimeShow: true

dbi_mtp:
  MACasTID:
    ShowMAC: true

dbi_access_point:
  SSID:
    UseAP: true
  Password:
    UseAP: true
  Use5GHz:
    UseAP: true
  Hidden:
    UseAP: true

jksv:
  KeepLocalBackups:
    AutoUploadToRemote: true
  ZipCompressionLevel:
    ExportToZip: true
